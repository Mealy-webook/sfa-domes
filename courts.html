<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courts · SFA Domes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=fitness_center,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<style>
/* Sports page, "Poster" layout (concept 4, picked by Ahmed) in white: a text-only hero (sport, name, line) that leaves
   the first court cards in view; each court is a poster tile (photo, big outlined number, details on the image).
   Design-system tokens only (f/fonts.css text styles, f/colors.css); square corners. */
:root{color-scheme:light;--nav:90px;--g:clamp(16px,6.67vw,96px);--ease:cubic-bezier(.22,1,.36,1);--max:1440px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg-primary);color:var(--color-content-primary);font:var(--ts-body-m);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--color-brand);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
img{display:block}
@keyframes up{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}

/* hero: text only (no photo, Ahmed's call), on white under the fixed bar, so the court cards follow right after it */
.hero{padding-top:var(--nav)}
.cap{width:100%;min-width:0;max-width:var(--max);margin:0 auto;padding:clamp(32px,7vh,72px) var(--g) 0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;animation:up 1s var(--ease) .1s both}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0;font:var(--ts-label-l);text-transform:var(--type-case-label)}
.ico{display:grid;place-items:center;width:32px;height:32px;flex:none;background:var(--color-brand);color:var(--neutral-0)}
.ico .msi{font-size:var(--fs-20)}
.ico img{width:20px;height:20px}
.name{margin:0;font:var(--ts-display-xl);text-transform:var(--type-case-display)}
.sub{font:var(--ts-body-l);margin:0;max-width:46ch;color:var(--color-content-secondary)}

/* courts */
.courts{max-width:var(--max);margin:0 auto;padding:clamp(40px,7vh,72px) var(--g) clamp(56px,9vh,96px)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid var(--color-border-secondary)}
.head h2{font:var(--ts-title-m);text-transform:var(--type-case-title);margin:0}
.head > span{font:var(--ts-label-m);color:var(--color-content-tertiary)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--neutral-900);color:var(--neutral-0);isolation:isolate;animation:up .7s var(--ease) both;animation-delay:calc(.05s * var(--i,0))}
.tile > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.1s var(--ease)}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,11,.1),rgba(9,9,11,.8))}
.tile:hover > img{transform:scale(1.06)}
.tile::before{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;z-index:1;background:var(--color-brand);scale:0 1;transform-origin:0 50%;transition:scale .5s var(--ease)}
[dir=rtl] .tile::before{transform-origin:100% 50%}
.tile:hover::before,.tile:focus-within::before,.tile.picked::before{scale:1 1}
.no{position:absolute;top:8px;inset-inline-start:16px;font:var(--ts-number-l);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.85);transition:color .4s,-webkit-text-stroke-color .4s}
.tile:hover .no,.tile.picked .no{color:var(--color-brand);-webkit-text-stroke-color:var(--color-brand)}
.tile .sfa-fav{position:absolute;top:16px;inset-inline-end:16px;z-index:2}
.link{position:absolute;inset:0;z-index:1}
.link:focus-visible{outline-offset:-2px}
.body{position:absolute;inset-inline:20px;bottom:20px;display:grid;gap:8px;padding-inline-end:40px}
.cname{font:var(--ts-title-s);text-transform:var(--type-case-title);margin:0}
.spec{font:var(--ts-body-s);color:rgba(255,255,255,.75)}
.price{display:inline-flex;align-items:baseline;gap:8px}
.price small{font:var(--ts-body-s);color:rgba(255,255,255,.75)}
.price b{font:var(--ts-number-s);display:inline-flex;align-items:center;gap:4px}
.arr{position:absolute;bottom:24px;inset-inline-end:20px;width:22px;height:22px;transition:transform .45s var(--ease)}
[dir=rtl] .arr{scale:-1 1}
.tile:hover .arr{transform:translate(4px,-4px)}
[dir=rtl] .tile:hover .arr{transform:translate(-4px,-4px)}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div data-site-nav></div>
<main id="page"></main>
<div data-site-footer></div>

<script src="f/site-nav.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script>
(() => {
  const S = window.SFA_SPORTS, P = window.SFA_PREFS, t = P.t;
  const params = new URLSearchParams(location.search);
  const key = S[params.get('sport')] ? params.get('sport') : 'basketball';
  const sport = S[key], courts = sport.courts, n = courts.length;
  const root = document.getElementById('page');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // the same photo on several courts gets a different framing on each (zoomed into another part), so tiles don't look identical
  const CROPS = [['50% 50%', 1], ['12% 72%', 1.45], ['88% 62%', 1.45], ['50% 92%', 1.6], ['22% 30%', 1.5], ['78% 80%', 1.5]];
  const crop = i => `transform-origin:${CROPS[i % CROPS.length][0]};scale:${CROPS[i % CROPS.length][1]}`;
  const url = i => `court-details.html?sport=${encodeURIComponent(key)}&court=${i}`;
  const arrow = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';

  function paint(){
    const name = esc(t(sport.name));
    document.title = `${t(sport.name)} · ${t('Courts')} · SFA Domes`;
    const sub = sport.area === 'field'
      ? t(key === 'rugby' ? 'Played on football fields F4 and F5 joined together.' : '5 indoor football fields: play 5-a-side, or book F4 and F5 together for 7-a-side.')
      : t('{n} indoor multipurpose courts. Pick one to book.', { n });
    const icon = sport.img ? `<img src="${sport.img}" alt="">` : `<span class="msi">${sport.icon}</span>`;
    root.innerHTML = `<section class="hero" aria-labelledby="sportName">
        <div class="cap"><p class="eyebrow"><span class="ico" aria-hidden="true">${icon}</span>${t('SFA Domes Dammam')}</p><h1 id="sportName" class="name">${name}</h1><p class="sub">${sub}</p></div></section>
      <section class="courts" aria-labelledby="chooseH"><div class="head"><h2 id="chooseH">${t('Choose a court')}</h2><span>${n === 1 ? t('1 court') : t('{n} courts', { n })}</span></div>
        <div class="grid">${courts.map((c, i) => `<article class="tile" style="--i:${i}">
          <a class="link" href="${url(i)}" data-i="${i}"><span class="sr">${t('View court')}: ${esc(t(c[0]))}</span></a>
          <img src="${window.SFA_COURT_IMG(key, c)}" alt="${esc(t(c[0]))}" loading="lazy" style="${crop(i)}"><span class="no" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>${window.SFA_AUTH.heart(`${key}|${i}`)}
          <div class="body"><h3 class="cname">${esc(t(c[0]))}</h3><span class="spec">${[c[1], c[2], c[3], c[4]].filter(Boolean).map(v => esc(t(v))).join(' · ')}</span>
            <span class="price"><small>${t('From')}</small><b>${P.money(c[5])}</b><small>${t('/ hr')}</small></span></div>${arrow}</article>`).join('')}</div></section>`;
    // back from the details page: the court you opened stays marked
    const pre = root.querySelector(`.link[data-i="${params.get('court')}"]`);
    if (params.has('court') && pre) pre.closest('.tile').classList.add('picked');
    shrink();
    window.SFA_AUTH.paintFavs?.();
  }
  // a long sport name (Basketball, Table Tennis) shrinks until it fits the width, so it never spills off a phone
  const shrink = () => { const h = root.querySelector('.name'); if (!h) return; h.style.fontSize = ''; const k = h.clientWidth / h.scrollWidth; if (k < 1) h.style.fontSize = parseFloat(getComputedStyle(h).fontSize) * k * .98 + 'px'; };
  // remember which court was opened, so Back lands on this page with it marked
  root.addEventListener('click', e => { const a = e.target.closest('.link'); if (a) history.replaceState(null, '', `?sport=${encodeURIComponent(key)}&court=${a.dataset.i}`); });
  paint();
  addEventListener('sfa:prefs', paint);
  addEventListener('resize', shrink); document.fonts?.ready.then(shrink);
})();
</script>
</body>
</html>
