<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open game · SFA Domes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=fitness_center,groups,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<link rel="stylesheet" href="f/court-details.css">
<link rel="stylesheet" href="f/kl.css">
<style>
/* One open game (game.html?id=<sport|court|date|start>), on the same layout as court and program details (f/kl.css,
   Ahmed 2026-11-11: same look and feel everywhere): breadcrumb, photo, the eyebrow, title, badges and facts, then the
   booking section "Join this game" (who's playing — you for adult games, one of your children 6–17 for kids' games —
   the summary, the terms and Join), How it works and Location; a price card beside it on desktop and the bottom bar on
   phones. Each person's first open game is free; server.js re-checks everything. DS tokens only; square corners. */
.mi{display:inline-block;width:20px;height:20px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.gm-photo{position:relative;height:clamp(280px,32vw,460px);margin:0 0 28px;overflow:hidden;background:var(--color-bg-tertiary)}
.gm-photo img{width:100%;height:100%;object-fit:cover}
.kl-badges li.kids{background:var(--color-programme-youth,var(--color-brand));color:var(--neutral-0)}
.kl-badges li.free{background:var(--color-bg-accent-subtle);color:var(--color-content-accent)}
.spots{display:grid;gap:8px;margin-top:24px;padding:16px 20px;border:1px solid var(--color-border-primary);background:var(--color-bg-primary)}
.spots-t{display:flex;justify-content:space-between;gap:8px;font:var(--ts-label-m)}
.spots-t small{font:var(--ts-body-s);color:var(--color-content-secondary)}
.bar{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.bar i{height:8px;background:var(--color-bg-tertiary)}
.bar i.on{background:var(--color-content-primary)}
/* the booking section */
.jn{display:grid;gap:20px;padding:24px;border:1px solid var(--color-border-primary);background:var(--color-bg-primary)}
.pl{display:grid;gap:8px}
.pl > span{font:var(--ts-label-m);color:var(--color-content-secondary)}
.opt{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);text-align:start;font:inherit;color:inherit;cursor:pointer}
.opt:hover{border-color:var(--color-content-primary)}
.opt[aria-checked=true]{border:2px solid var(--color-brand);padding:15px 17px;background:var(--color-bg-accent-subtle)}
.opt:disabled{cursor:not-allowed;background:var(--color-bg-secondary);border-color:var(--color-border-primary)}
.opt .dot{width:20px;height:20px;border:2px solid var(--color-border-strong);border-radius:50%}
.opt[aria-checked=true] .dot{border:6px solid var(--color-brand)}
.opt b{display:block;font:var(--ts-label-l)}
.opt small{display:block;font:var(--ts-body-s);color:var(--color-content-secondary)}
.opt:disabled b{opacity:.5}
.opt:disabled small{color:var(--color-danger)}
.opt em{font:var(--ts-label-s);font-style:normal;color:var(--color-content-accent)}
.rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font:var(--ts-body-s)}
.rows dt{color:var(--color-content-tertiary)}
.rows dd{margin:0;text-align:end;overflow-wrap:anywhere}
.rows .sep{grid-column:1/-1;height:1px;margin-top:4px;background:var(--color-border-primary)}
.rows .total{padding-top:4px;font:var(--ts-label-l)}
.rows dd.total{font:var(--ts-number-s)}
.rows s{color:var(--color-content-tertiary);margin-inline-end:8px}
.note{margin:0;padding:12px 16px;background:var(--color-bg-secondary);font:var(--ts-body-s);color:var(--color-content-secondary)}
.note.bad{border-inline-start:4px solid var(--color-danger)}
.terms{position:relative;display:flex;align-items:flex-start;gap:12px;font:var(--ts-body-s);cursor:pointer}
.terms input{position:absolute;opacity:0}
.terms .box{display:grid;place-items:center;flex:none;width:22px;height:22px;border:1.5px solid var(--color-border-secondary)}
.terms .box svg{width:14px;height:14px;opacity:0}
.terms input:checked + .box{background:var(--color-brand);border-color:var(--color-brand)}
.terms input:checked + .box svg{opacity:1}
.terms input:focus-visible + .box{outline:2px solid var(--color-brand);outline-offset:2px}
.terms.bad .box{border-color:var(--color-danger)}
.err{margin:0;font:var(--ts-body-s);color:var(--color-danger)}
.err:empty{display:none}
.jn .book svg,.go .book svg{flex:none;width:20px;height:20px}
[dir=rtl] .jn .book svg,[dir=rtl] .go .book svg{scale:-1 1}
.go .book{white-space:nowrap}
.jn .book:disabled{background:var(--color-bg-tertiary);color:var(--color-content-disabled);cursor:not-allowed}
.jn .book.ghost{background:var(--color-bg-primary);border:1px solid var(--color-border-secondary);color:var(--color-content-primary);text-decoration:none}
.how{list-style:none;margin:0;padding:0;display:grid;gap:0}
.how li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--color-border-primary);font:var(--ts-body-m);color:var(--color-content-secondary);counter-increment:h}
.how{counter-reset:h}
.how li::before{content:counter(h);display:grid;place-items:center;width:32px;height:32px;background:var(--color-content-primary);color:var(--neutral-0);font:var(--ts-label-m)}
.how b{display:block;color:var(--color-content-primary);font:var(--ts-label-l)}
.gm-empty{display:grid;justify-items:start;gap:16px;padding:40px;border:1px dashed var(--color-border-secondary);background:var(--color-bg-primary)}
.gm-empty p{margin:0;font:var(--ts-body-l);color:var(--color-content-secondary)}
@media (max-width:760px){.gm-photo{height:auto;aspect-ratio:4/3;margin-inline:calc(var(--g,16px) * -1)}.jn{padding:20px}}
</style>
</head>
<body class="v-q" data-go-always>
<div data-site-nav></div>
<main>
<div class="kl">
  <div class="inner" id="page">
  </div>
</div>
</main>
<div data-site-footer></div>
<div class="go" id="go">
  <div class="inner">
    <div class="go-pick"><small id="goWhen"></small><strong id="goTotal"></strong></div>
    <a class="book" id="goBtn" href="#join"></a>
  </div>
</div>
<template id="locTpl">
        <section class="kl-sec" id="loc" aria-labelledby="locTitle">
          <h2 class="kl-h" id="locTitle">Location</h2>
        <div class="loc-grid">
          <div class="loc-card">
            <p class="loc-name">SFA Domes Dammam</p>
            <p class="loc-city">Dammam, Saudi Arabia</p>
            <ul class="loc-list">
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1"/></svg><a href="tel:+966537448666" dir="ltr">+966 53 744 8666</a></li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="m3 7 9 6 9-6"/></svg><a href="mailto:Domes.info@sfa.sa">Domes.info@sfa.sa</a></li>
            </ul>
            <a class="loc-btn" href="https://www.google.com/maps/dir/?api=1&amp;destination=26.4047835,50.0250094" target="_blank" rel="noopener"><span>Directions</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
          </div>
          <div class="loc-map" id="locMap">
            <iframe title="Map showing SFA Domes in Dammam" src="https://www.google.com/maps/embed?origin=mfe&amp;pb=!1m3!2m1!1s26.4047835,50.0250094!6i15" loading="lazy" referrerpolicy="no-referrer-when-downgrade" tabindex="-1"></iframe>
            <button class="loc-cover" type="button"><span>Click to explore the map</span></button>
          </div>
        </div>
        </section>
</template>
<script src="f/site-nav.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/programs-data.js"></script>
<script src="f/games-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script>
(() => {
  const P = window.SFA_PREFS, t = P.t, S = window.SFA_SPORTS, SLOT = window.SFA_SCHEDULE.SLOT, WHO = window.SFA_GAME_WHO;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const root = document.getElementById('page'), id = new URLSearchParams(location.search).get('id') || '';
  const toDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const icon = sp => sp.img ? `<span class="mi" style="--m:url(${sp.img})"></span>` : `<span class="msi">${sp.icon}</span>`;
  const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true">${p}</svg>`;
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="square" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14m-6-7 7 7-7 7"/></svg>';
  const I = {
    cal: SV('<path d="M4 6h16v14H4zM4 10h16M8 3v4m8-4v4"/>'), pin: SV('<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><path d="M12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>'),
    who: SV('<path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.3a3.5 3.5 0 0 1 0 6.6M18 13.5a6.5 6.5 0 0 1 3.5 6.5"/>'), fmt: SV('<path d="M3 5h18v14H3zM12 5v14"/><path d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/>')
  };
  let me = null, mine = [], online = {}, pick = null, agreed = false, busy = false, err = '';
  const g = window.SFA_GAME(id);
  // who already holds a spot, and who has had a game before (the first is free), from the account's bookings
  const keyOf = b => b.order.bookingFor && b.order.bookingFor.type === 'child' ? 'child:' + (b.order.bookingFor.ref || b.order.bookingFor.name) : 'me';
  const inGame = k => mine.some(b => b.order.kind === 'game' && b.order.game === id && b.status === 'paid' && keyOf(b) === k);
  const hadGame = k => mine.some(b => b.order.kind === 'game' && b.status === 'paid' && keyOf(b) === k);
  const taken = () => g.base + ((online[g.id] || {}).taken || 0);
  const started = () => { const n = new Date(), k = window.SFA_TODAY(n); return g.date < k || (g.date === k && g.start <= n.getHours() * 60 + n.getMinutes()); };
  // the people on the account who could take a spot: you (adult games) or each child (kids' games)
  function people(){
    if (!me) return [];
    const you = { key: 'me', ref: 'me', name: me.name, dob: me.dob, you: true };
    const kids = (me.participants || []).map(c => ({ key: 'child:' + c.id, ref: c.id, name: c.name, dob: c.dob }));
    return (g.who === 'kids' ? kids : [you]).map(x => {
      const age = x.dob ? window.SFA_AGE(x.dob, g.date) : null;
      const why = inGame(x.key) ? t('Already in this game') : x.you && !x.dob ? t('Add your date of birth in My account') : window.SFA_GAME_FITS(g, x) ? (g.who === 'kids' ? t('Must be 6 to 17 on the day') : t('Adults (18+) only')) : '';
      return { ...x, age, why, free: !hadGame(x.key) };
    });
  }
  const crumbs = last => `<nav class="kl-crumbs" aria-label="${t('Breadcrumb')}"><a href="index.html">${t('Home')}</a>${CHEV}<a href="matches.html${g ? '?day=' + encodeURIComponent(g.date) : ''}">${t('Open games')}</a>${CHEV}<span>${last}</span></nav>`;

  function joinBox(sp, c, left){
    const list = people(), ok = list.filter(x => !x.why);
    if (pick && !ok.some(x => x.key === pick)) pick = null;
    if (!pick && ok.length === 1) pick = ok[0].key;
    const who = list.find(x => x.key === pick), free = who ? who.free : false, price = free ? 0 : g.price;
    const when = `${P.date(toDate(g.date), 'full')} · <bdi>${P.time(g.start)}</bdi> – <bdi>${P.time(g.start + SLOT)}</bdi>`;
    const closed = started() ? t('This game has already started.') : left <= 0 ? t('This game is full.') : '';
    if (!me) return `<div class="jn"><p class="note">${t('Sign in to join a game.')}</p><button type="button" class="book" data-signin>${t('Sign in')}</button></div>`;
    if (closed) return `<div class="jn"><p class="note bad">${closed}</p><a class="book ghost" href="matches.html">${t('Find another game')}</a></div>`;
    return `<div class="jn"><div class="pl" role="radiogroup" aria-labelledby="plL"><span id="plL">${t("Who's playing?")}</span>
        ${list.length ? list.map(x => `<button type="button" class="opt" role="radio" aria-checked="${x.key === pick}" data-pick="${esc(x.key)}"${x.why ? ' disabled' : ''}><span class="dot" aria-hidden="true"></span>
          <span><b>${esc(x.you ? t('Myself') : x.name)}</b><small>${x.why || (x.age != null ? t('Age {n}', { n: x.age }) : '')}</small></span>${!x.why && x.free ? `<em>${t('First game free')}</em>` : ''}</button>`).join('')
        : `<p class="note">${t('Kids’ games are for your children aged 6 to 17. Add them in My children.')} <a href="profile.html#people">${t('My children')}</a></p>`}</div>
      <dl class="rows"><dt>${t('Game')}</dt><dd>${esc(t(sp.name))} · ${esc(t(g.format))}</dd><dt>${t('When')}</dt><dd>${when}</dd><dt>${t('Where')}</dt><dd>${esc(t(c[0]))} · ${t('SFA Domes Dammam')}</dd>
        <dt>${t('Player')}</dt><dd>${who ? esc(who.you ? me.name : who.name) : '—'}</dd><dt>${t('Your spot')}</dt><dd>${free ? `<s>${P.money(g.price)}</s>${t('Free')}` : P.money(g.price)}</dd>
        <span class="sep" aria-hidden="true"></span><dt class="total">${t('Total')}</dt><dd class="total">${price ? P.money(price) : t('Free')}</dd></dl>
      ${free ? `<p class="note">${t("{name}'s first open game is free.", { name: esc(who.you ? t('Your') : who.name.split(' ')[0]) })}</p>` : ''}
      <label class="terms${err && !agreed ? ' bad' : ''}" id="jTerms"><input type="checkbox" id="jT"${agreed ? ' checked' : ''}><span class="box" aria-hidden="true">${TICK}</span><span>${t('I agree to the terms and conditions and the health waiver.')}</span></label>
      <p class="err" role="alert">${esc(err)}</p>
      <button type="button" class="book" id="jGo"${!who || busy ? ' disabled' : ''}><span>${busy ? t('One moment…') : !who ? t("Choose who's playing") : price ? t('Pay {total}', { total: P.money(price) }) : t('Join for free')}</span>${who && !busy ? ARROW : ''}</button></div>`;
  }

  function paint(){
    if (!g){
      root.innerHTML = `${crumbs(t('Game'))}<div class="gm-empty"><p>${t('That game is no longer on.')}</p><a class="book" href="matches.html" style="width:auto">${t('See open games')}</a></div>`;
      document.getElementById('go').classList.remove('on'); return;
    }
    const sp = S[g.sport], c = sp.courts[g.court], n = taken(), left = Math.max(0, g.spots - n), w = WHO[g.who], title = `${t(sp.name)} · ${t(g.format)}`;
    document.title = `${t(sp.name)} · ${t('Open game')} · SFA Domes`;
    root.innerHTML = `${crumbs(esc(title))}
      <div class="gm-photo"><img src="${window.SFA_COURT_IMG(g.sport, c)}" alt=""></div>
      <div class="kl-cols"><div class="kl-main">
        <header class="kl-head about" id="overview" style="padding:0;border:0;background:none">
          <p class="eyebrow lbl"><span class="ico" aria-hidden="true">${icon(sp)}</span>${t('Open game')} · ${t('SFA Domes Dammam')}</p>
          <h1>${esc(title)}</h1>
          <ul class="kl-badges"><li class="${g.who === 'kids' ? 'kids' : ''}">${CHK}<span>${t(w.label)}</span></li><li>${CHK}<span>${t('Indoor')}</span></li><li>${CHK}<span>${t('Bibs and balls provided')}</span></li><li class="free">${CHK}<span>${t('First game free')}</span></li></ul>
          <ul class="kl-facts">
            <li>${I.cal}<div><b>${P.date(toDate(g.date), 'full')}</b><small><bdi>${P.time(g.start)}</bdi> – <bdi>${P.time(g.start + SLOT)}</bdi> · ${t('{m} minutes', { m: SLOT })}</small></div></li>
            <li>${I.who}<div><b>${t(w.label)}</b><small>${t(g.who === 'kids' ? 'Book a spot for one of your children' : 'Book a spot for yourself')}</small></div></li>
            <li>${I.fmt}<div><b>${esc(t(g.format))}</b><small>${t('Up to {n} players', { n: g.spots })}</small></div></li>
            <li>${I.pin}<div><b>${t('SFA Domes Dammam')}</b><small>${esc(t(c[0]))}</small></div></li></ul>
          <div class="spots"><div class="spots-t"><span>${left <= 0 ? t('Full') : left === 1 ? t('1 spot left') : t('{n} spots left', { n: left })}</span><small>${t('{a} of {b} players', { a: n, b: g.spots })}</small></div>
            <div class="bar" style="--n:${g.spots}" aria-hidden="true">${Array.from({ length: g.spots }, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div></div>
        </header>
        <section class="kl-sec" id="join" aria-labelledby="joinH"><h2 class="kl-h" id="joinH">${t('Join this game')}</h2>${joinBox(sp, c, left)}</section>
        <section class="kl-sec" id="how" aria-labelledby="howH"><h2 class="kl-h" id="howH">${t('How it works')}</h2>
          <ol class="how"><li><span><b>${t('Join and pay for your spot only')}</b>${t('No team needed. Each person’s first open game is free.')}</span></li>
            <li><span><b>${t('Arrive 10 minutes early')}</b>${t('Check in at reception with your ticket’s QR code.')}</span></li>
            <li><span><b>${t('Play')}</b>${t('A coach splits the teams and runs the game. Bibs and balls are provided.')}</span></li></ol></section>
        ${document.getElementById('locTpl').innerHTML}
      </div>
      <aside class="kl-side" aria-label="${t('Price')}"><div class="kl-card"><div class="hero-book"><p class="hero-price"><small>${t('From')}</small><b>${P.money(g.price)}</b></p>
          <div class="hero-actions"><a class="cta" href="#join"><span>${t('Join game')}</span>${ARROW}</a></div></div><p class="side-sub">${t('per player')} · ${t('First game free')}</p></div>
        <p class="kl-note">${CHK}<span>${t('Each person’s first open game is free.')}</span></p></aside></div>`;
    document.getElementById('goWhen').innerHTML = `${P.date(toDate(g.date), 'short')} · <bdi>${P.time(g.start)}</bdi>`;
    document.getElementById('goTotal').innerHTML = `${P.money(g.price)} <small>${t('per player')}</small>`;
    document.getElementById('goBtn').innerHTML = `<span>${t('Join game')}</span>${ARROW}`;
    P.translate?.(root);
    watch();
  }
  // the bottom bar (phones) and the price card step aside while the booking section is in view, as on court and program pages
  let io;
  function watch(){
    io && io.disconnect(); const j = document.getElementById('join'), go = document.getElementById('go'); if (!j) return;
    const phone = matchMedia('(max-width:1023px)');   // the bar is for phones and tablets only; desktop has the price card
    io = new IntersectionObserver(([e]) => { go.classList.toggle('on', phone.matches && !e.isIntersecting); document.body.classList.toggle('kl-in-book', e.isIntersecting); }, { rootMargin: '0px 0px -30% 0px' });
    io.observe(j);
  }

  document.addEventListener('click', e => { const a = e.target.closest('a[href="#join"]'); if (!a) return; e.preventDefault(); document.getElementById('join')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  root.addEventListener('click', async e => {
    const o = e.target.closest('[data-pick]'); if (o && !o.disabled){ pick = o.dataset.pick; err = ''; paint(); root.querySelector(`[data-pick="${pick}"]`)?.focus(); return; }
    if (e.target.closest('[data-signin]')) return window.SFA_AUTH.open({ view: 'login', reason: t('Sign in to join a game.') });
    if (!e.target.closest('#jGo')) return;
    agreed = root.querySelector('#jT').checked;
    if (!agreed){ err = t('Accept the terms to continue'); paint(); root.querySelector('#jT').focus(); return; }
    const who = people().find(x => x.key === pick); if (!who) return;
    busy = true; err = ''; paint();
    try {
      const r = await fetch('/api/checkout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ order: { kind: 'game', game: g.id, player: { ref: who.ref } }, terms: true, waiver: true }) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401){ busy = false; paint(); return window.SFA_AUTH.open({ view: 'login', reason: t('Sign in to join a game.') }); }
      if (!r.ok || !d.redirect_url){ busy = false; err = t(d.error || 'Could not start the payment. Try again.'); await load(); return; }
      location.href = d.redirect_url;
    } catch (x) { busy = false; err = t('Could not reach the server. Try again.'); paint(); }
  });
  root.addEventListener('change', e => { if (e.target.id === 'jT'){ agreed = e.target.checked; if (agreed) err = ''; root.querySelector('#jTerms').classList.remove('bad'); } });

  async function load(){
    me = await window.SFA_AUTH.me();
    const [b, o] = await Promise.all([me ? fetch('/api/auth/bookings').then(r => r.json()).catch(() => ({})) : {}, g ? fetch('/api/games?days=' + g.date, { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})) : {}]);
    mine = b.bookings || []; online = o || {}; paint();
  }
  paint(); load();
  addEventListener('sfa:auth', load);
  addEventListener('sfa:prefs', paint);
})();
</script>
</body>
</html>
