<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booking · SFA Domes · option M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="f/tickets.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=fitness_center,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<link rel="stylesheet" href="f/result-base.css">
<style>
/* Confirmation option M · Booking card (benchmark: Time2book, Cal.com): one calm column. "Booking confirmed", the headline and the ref, then a single card with what, when (the weekly pattern for repeating bookings), who, where and the total; every date folds away under "Show all". A note says tickets live in My tickets and each QR works on its day. View my tickets leads, Book more and Add to calendar follow; payment details fold.
   Review page (result-options.html); the live page is result.html. Logic: f/result-core.js. DS tokens only, square corners. No QR codes, directions or cancellation rule on this page. */
.opt-tag{position:fixed;inset-inline-end:16px;bottom:16px;z-index:50;padding:8px 12px;background:var(--color-bg-inverse);color:var(--color-content-inverse);font:var(--ts-caption-1-bold);text-decoration:none}
body[data-state=paid] .cf-head{display:none}
body[data-state=paid] .cf-grid{display:block}
.m-wrap{max-width:600px;margin:0 auto;display:grid;gap:16px}
.m-ok{display:flex;align-items:center;gap:12px;margin:0;font:var(--ts-body-default-bold);color:var(--color-brand);animation:up .6s var(--ease) both}
.m-ok i{display:grid;place-items:center;width:32px;height:32px;background:var(--color-brand);color:var(--neutral-0)}
.m-ok svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square}
.m-wrap h1{font:var(--ts-display-m);text-transform:var(--type-case-display);animation:up .6s var(--ease) .05s both}
.m-ref{margin:-8px 0 8px;font:var(--ts-body-s);color:var(--color-content-secondary)}
.m-ref .ref{font:var(--ts-body-default-bold);color:var(--color-content-primary)}
.m-card{display:grid;background:var(--color-bg-primary);border:1px solid var(--color-border-primary);animation:up .6s var(--ease) .1s both}
.m-what{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--color-border-primary);border-inline-start:4px solid var(--color-brand)}
.m-what img{width:96px;height:72px;object-fit:cover}
.m-what small{display:block;font:var(--ts-caption-1-bold);color:var(--color-content-tertiary)}
.m-what b{display:block;margin-top:2px;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.m-what span{display:block;margin-top:2px;font:var(--ts-body-s);color:var(--color-content-secondary)}
.m-rows{margin:0;display:grid}
.m-rows div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:16px 20px;border-bottom:1px solid var(--color-border-primary)}
.m-rows dt{font:var(--ts-body-default-bold);color:var(--color-content-secondary)}
.m-rows dd{margin:0;text-align:end;font:var(--ts-body-l-bold);overflow-wrap:anywhere}
.m-rows dd span{font:var(--ts-body-s);color:var(--color-content-secondary)}
.m-rows .sfa-money{font:var(--ts-title-body)}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.m-fold summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;font:var(--ts-body-default-bold)}
.m-fold summary::after{content:"";width:8px;height:8px;margin-inline-end:4px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -2px;transition:rotate .2s}
.m-fold[open] summary::after{rotate:-135deg;translate:0 2px}
.m-fold summary:hover{color:var(--color-brand)}
.m-dates{list-style:none;margin:0;padding:0 20px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.m-dates li{display:grid;gap:2px;padding:10px 12px;background:var(--color-bg-secondary)}
.m-dates small{font:var(--ts-caption-1);color:var(--color-content-tertiary)}
.m-dates b{font:var(--ts-body-default-bold)}
.m-dates span{font:var(--ts-body-s);color:var(--color-content-secondary)}
.m-dates li.now{box-shadow:inset 3px 0 0 var(--color-brand)}
[dir=rtl] .m-dates li.now{box-shadow:inset -3px 0 0 var(--color-brand)}
.m-note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:16px 20px;background:var(--color-bg-tertiary);animation:up .6s var(--ease) .15s both}
.m-note svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.m-note p{margin:0;font:var(--ts-body-s);color:var(--color-content-secondary)}
.m-note b{display:block;font:var(--ts-body-default-bold);color:var(--color-content-primary)}
.m-acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;animation:up .6s var(--ease) .2s both}
.m-acts .btn{grid-column:1/-1}
.m-acts .ghost{height:52px}
.m-pay{background:var(--color-bg-primary);border:1px solid var(--color-border-primary)}
.m-pay .rows{padding:0 20px 20px}
@media (max-width:560px){.m-wrap h1{font:var(--ts-display-s)}.m-rows div{grid-template-columns:minmax(0,1fr);gap:4px}.m-rows dd{text-align:start}.m-acts{grid-template-columns:minmax(0,1fr)}.m-what{grid-template-columns:72px minmax(0,1fr)}.m-what img{width:72px;height:56px}}
</style>
</head>
<body>
<div data-site-nav></div>
<main class="cf pending" id="cf" aria-live="polite">
  <header class="cf-head"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" id="markIcon"><path d="M12 3a9 9 0 1 0 9 9"/></svg></span>
    <h1 id="title">Checking your payment</h1><p class="cf-sub" id="sub">One moment while we confirm with PayTabs.</p></header>
  <div class="cf-grid" id="body"></div>
</main>
<div data-site-footer></div>
<a class="opt-tag" href="result-options.html">Option M · Booking card</a>

<script src="f/site-nav.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/programs-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script src="f/tickets.js"></script>
<script>
window.RESULT_VIEW = {
  paid: m => { const { t, esc, ICON, acts } = m, P = window.SFA_PREFS, T = window.SFA_TICKETS, n = m.days.length, s0 = m.days[0];
    const now = new Date(), todayK = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const next = m.days.find(s => s.date >= todayK) || s0;
    const kind = m.prog ? t(m.b.order.plan === 'trial' ? 'Free trial' : 'Training program') : m.game ? `${t('Open game')} · ${t(m.b.order.level)}` : m.ladies ? t('Ladies hours') : t('Court booking');
    const when = n === 1 ? `${m.date(s0)}<br><span>${m.time(s0)}</span>` : m.pattern ? `${m.pattern}<br><span>${t('{n} sessions · {range}', { n, range: m.when })}</span>` : `${m.when}<br><span>${t('{n} sessions', { n })}</span>`;
    const note = n > 1 ? t('Every session has its own ticket there. Its QR code works only on the day of the session.') : t('Its QR code works only on the day of the session.');
    return `<div class="m-wrap">
      <p class="m-ok"><i>${ICON.check}</i>${t('Booking confirmed')}</p>
      <h1>${t(m.title)}</h1><p class="m-ref">${m.ref}</p>
      <article class="m-card">
        <header class="m-what"><img src="${m.D.img}" alt=""><div><small>${kind}</small><b>${esc(m.D.title)}</b><span>${esc(t(m.sport?.name || ''))} · ${t('{m} minutes', { m: s0.end - s0.start })}</span></div></header>
        <dl class="m-rows"><div><dt>${t('When')}</dt><dd>${when}</dd></div>
          <div><dt>${t(m.prog ? (T.people(m.b).length > 1 ? 'Participants' : 'Participant') : 'Booked for')}</dt><dd>${m.who}</dd></div>
          ${m.coach ? `<div><dt>${t('Coach')}</dt><dd>${esc(m.coach)}</dd></div>` : ''}
          <div><dt>${t('Where')}</dt><dd>${m.place}</dd></div>
          <div><dt>${t(m.b.free ? 'Total' : 'Paid')}</dt><dd>${m.b.free ? t('Free of charge') : m.money(m.b.amount)}</dd></div></dl>
        ${n > 1 ? `<details class="m-fold"><summary>${t('Show all {n} dates', { n })}</summary><ol class="m-dates">${m.days.map(s => `<li${s === next ? ' class="now"' : ''}><small>${t('Session {n}', { n: s.n })}</small><b>${m.date(s, 'short')}</b><span>${m.time(s)}</span></li>`).join('')}</ol></details>` : ''}
      </article>
      <div class="m-note">${ICON.qr}<p><b>${t(n > 1 || m.prog && T.people(m.b).length > 1 ? 'Your tickets are in My tickets' : 'Your ticket is in My tickets')}</b>${note}</p></div>
      <div class="m-acts"><a class="btn" href="${acts.tickets}">${t('View my tickets')}${ICON.arrow}</a>
        ${acts.more ? `<a class="ghost" href="${acts.more.href}">${acts.more.label}</a>` : ''}
        <a class="ghost" href="${acts.ics}" download="${acts.icsName}"${acts.more ? '' : ' style="grid-column:1/-1"'}>${ICON.cal}${t('Add to calendar')}</a></div>
      <details class="m-pay m-fold"><summary>${t(m.b.free ? 'Booking details' : 'Payment details')}</summary>${m.rows}</details>
    </div>`;
  }
};
</script>
<script src="f/result-core.js"></script>
</body>
</html>
