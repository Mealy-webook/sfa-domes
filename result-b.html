<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booking · SFA Domes · option B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="f/tickets.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=fitness_center,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<link rel="stylesheet" href="f/result-base.css">
<style>
/* Confirmation option B · Receipt: one calm centred column, like a receipt: what you bought, each session as a line with its QR folded away, then one main action.
   Review page (result-options.html); the live page is result.html. Logic: f/result-core.js. DS tokens only, square corners. */
.opt-tag{position:fixed;inset-inline-end:16px;bottom:16px;z-index:50;padding:8px 12px;background:var(--color-bg-inverse);color:var(--color-content-inverse);font:var(--ts-label-s);text-decoration:none}
body[data-state=paid] .cf-head{justify-items:center;text-align:center;grid-template-columns:minmax(0,1fr);max-width:560px;margin-inline:auto}
body[data-state=paid] .cf-head .mark{grid-row:auto}
body[data-state=paid] .cf-grid{grid-template-columns:minmax(0,560px);justify-content:center}
.b-col{display:grid;gap:16px;animation:up .7s var(--ease) .1s both}
.b-rc{position:relative;background:var(--color-bg-primary);border:1px solid var(--color-border-primary)}
.b-what{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;padding:24px}
.b-what img{width:72px;height:72px;object-fit:cover}
.b-what small{display:block;font:var(--ts-label-s);color:var(--color-content-tertiary)}
.b-what strong{display:block;margin-top:4px;font:var(--ts-title-s);text-transform:var(--type-case-title)}
.b-what span{display:block;margin-top:4px;font:var(--ts-body-s);color:var(--color-content-secondary)}
.b-cut{position:relative;height:0;border-top:2px dashed var(--color-border-secondary);margin:0 24px}
.b-cut::before,.b-cut::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--color-bg-secondary);border:1px solid var(--color-border-primary)}
.b-cut::before{left:-37px;clip-path:inset(0 0 0 12px)}
.b-cut::after{right:-37px;clip-path:inset(0 12px 0 0)}
.b-sec{padding:24px}
.b-sec h2{margin:0 0 12px;font:var(--ts-label-m);color:var(--color-content-tertiary)}
.b-list{list-style:none;margin:0;padding:0}
.b-list li{border-top:1px solid var(--color-border-primary)}
.b-list li:first-child{border-top:0}
.b-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;width:100%;padding:12px 0;border:0;background:none;color:inherit;text-align:start;cursor:pointer}
.b-line b{display:block;font:var(--ts-label-l)}
.b-line span{display:block;font:var(--ts-body-s);color:var(--color-content-secondary)}
.b-qrb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--color-border-secondary);font:var(--ts-label-m)}
.b-qrb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.b-line[aria-expanded=true] .b-qrb{background:var(--color-content-primary);border-color:var(--color-content-primary);color:var(--neutral-0)}
.b-qr{display:grid;justify-items:center;gap:8px;padding:8px 0 20px}
.b-qr[hidden]{display:none}
.b-qr .tk-qr{width:180px}
.b-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b-col .more{margin-top:0}
.b-col .tips{padding:0 4px}
@media (max-width:480px){.b-two{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div data-site-nav></div>
<main class="cf pending" id="cf" aria-live="polite">
  <header class="cf-head"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" id="markIcon"><path d="M12 3a9 9 0 1 0 9 9"/></svg></span>
    <h1 id="title">Checking your payment</h1><p class="cf-sub" id="sub">One moment while we confirm with PayTabs.</p></header>
  <div class="cf-grid" id="body"></div>
</main>
<div data-site-footer></div>
<a class="opt-tag" href="result-options.html">Option B · Receipt</a>

<script src="f/site-nav.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/programs-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script src="f/tickets.js"></script>
<script>
window.RESULT_VIEW = {
  paid: m => { const { t, esc, ICON, acts } = m;
    return `<div class="b-col"><div class="b-rc">
        <div class="b-what"><img src="${m.D.img}" alt=""><div><small>${m.prog ? t('Training program') : t('SFA Domes Dammam')}</small><strong>${esc(m.D.label)}</strong><span>${m.when} · ${t('For {name}', { name: m.who })}</span></div></div>
        <div class="b-cut" aria-hidden="true"></div>
        <div class="b-sec"><h2>${t('{n} tickets', { n: m.count })}</h2><ul class="b-list">${m.list.map((s, i) => `<li>
          <button type="button" class="b-line" aria-expanded="false" aria-controls="bq${i}"><span><b>${m.date(s)}</b><span>${m.time(s)}${s.of > 1 ? ' · ' + t('{i} of {n}', { i: s.n, n: s.of }) : ''}${s.player ? ' · ' + esc(s.player) : ''}</span></span><span class="b-qrb">${ICON.qr}${t('QR')}</span></button>
          <div class="b-qr" id="bq${i}" hidden><div class="tk-qr" data-qr="${esc(s.id)}" role="img" aria-label="${t('QR code for {ref}', { ref: esc(s.id) })}"></div><span class="tk-ref">${esc(s.id)}</span></div></li>`).join('')}</ul></div>
        <div class="b-cut" aria-hidden="true"></div>
        <div class="b-sec">${m.rows}</div>
      </div>
      <a class="btn" href="${acts.tickets}">${t('View my tickets')}${ICON.arrow}</a>
      <div class="b-two"><a class="ghost" href="${acts.ics}" download="${acts.icsName}">${ICON.cal}${t('Add to calendar')}</a><a class="ghost" href="${acts.dir}" target="_blank" rel="noopener">${ICON.pin}${t('Get directions')}</a></div>
      ${acts.more ? `<a class="more" href="${acts.more.href}">${acts.more.label}</a>` : ''}
      <ul class="tips">${m.tips.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  },
  after: () => {
    document.querySelectorAll('.b-line').forEach((b, i) => {
      if (i === 0){ b.setAttribute('aria-expanded', 'true'); document.getElementById(b.getAttribute('aria-controls')).hidden = false; }
      b.addEventListener('click', () => { const on = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', on); document.getElementById(b.getAttribute('aria-controls')).hidden = !on; });
    });
  }
};
</script>
<script src="f/result-core.js"></script>
</body>
</html>
