<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sports section options · SFA Domes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=arrow_forward,exercise,fitness_center,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<style>
/* Options for the home page's "Every game one dome is waiting" section (Ahmed, 2026-11-19: "show me options").
   Six takes, each a full section on the brand orange with the real sports and court counts (f/courts-data.js), left-aligned
   (mirrored in Arabic), square corners, design-system tokens only (f/fonts.css, f/colors.css). Handball has no photo
   (removed at Ahmed's request): where an option needs one it shows a plain dark panel with the sport's icon.
   A = what the home page has now. G–L added the same day ("show me more options"). Every option lists the system's
   sports as the home page does: eight sports plus "Other sports" (volleyball, netball, GFX, table tennis). Local only. */
:root{--g:clamp(16px,6.67vw,96px);--max:1440px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--neutral-950);color:var(--neutral-0);font:var(--ts-body-default);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--neutral-0);outline-offset:3px}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.mi{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

/* switcher */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px var(--g);background:var(--neutral-950);border-bottom:1px solid rgba(255,255,255,.12);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar b{font:var(--ts-body-default-bold);margin-inline-end:8px;white-space:nowrap}
.bar a,.bar button{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.2);background:none;color:var(--neutral-0);font:var(--ts-body-s-bold);text-decoration:none;white-space:nowrap;cursor:pointer}
.bar a:hover,.bar button:hover{border-color:var(--neutral-0)}
.bar a i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;background:var(--color-brand);font:var(--ts-caption-1-bold)}
.bar .lang{margin-inline-start:auto}

/* every option */
.opt{position:relative;scroll-margin-top:65px}
.lbl{display:flex;align-items:baseline;gap:12px;padding:20px var(--g);background:var(--neutral-950);border-top:1px solid rgba(255,255,255,.12)}
.lbl i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;background:var(--color-brand);font:var(--ts-body-default-bold)}
.lbl b{font:var(--ts-title-body)}
.lbl span{font:var(--ts-body-s);color:var(--neutral-400)}
.sec{position:relative;background:var(--color-brand);color:var(--neutral-0);overflow:hidden;padding:calc(var(--g) * .75) 0}
.in{max-width:var(--max);margin:0 auto;padding-inline:var(--g)}
.h{margin:0 0 32px;font:var(--ts-display-s);text-transform:var(--type-case-display);text-align:start}
.cnt{font:var(--ts-caption-1-bold);text-transform:var(--type-case-label);opacity:.8}

/* cursor photo (A, B, E) */
.peek{position:absolute;z-index:6;left:0;top:0;width:clamp(180px,20vw,280px);aspect-ratio:4/5;pointer-events:none;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .25s,transform .35s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.peek img{display:block;width:100%;height:100%;object-fit:cover}
.peek b{position:absolute;inset-inline-start:10px;bottom:10px;padding:4px 8px;background:var(--neutral-950);font:var(--ts-body-default-bold);text-transform:var(--type-case-label)}

/* A · two columns, footer banner style (current) */
.oA ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,auto);grid-auto-flow:column;gap:0 clamp(24px,4vw,64px);margin:0;padding:clamp(24px,4vh,48px) 0;list-style:none;border-block:1px solid rgba(255,255,255,.3)}
.bn{display:inline-flex;align-items:center;gap:.25em;padding-block:4px;font-family:var(--type-font);font-weight:var(--type-w-title);font-size:var(--fs-40);line-height:1.05;text-transform:var(--type-case-title);text-decoration:none;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.7);transition:color .25s,-webkit-text-stroke-color .25s}
.bn.fill{color:var(--neutral-0);-webkit-text-stroke-color:transparent}
.bn::after{content:"";width:.22em;height:.22em;background:var(--neutral-950);flex:none}
.bn:hover,.bn:focus-visible{color:var(--neutral-950);-webkit-text-stroke-color:var(--neutral-950)}

/* B · moving rows, like the footer banner */
.oB .rows{padding-block:clamp(24px,4vh,48px);border-block:1px solid rgba(255,255,255,.3);direction:ltr}
.oB .row{display:flex;width:max-content;animation:mqL 48s linear infinite}
.oB .row.r2{animation-name:mqR}
.oB .rows:hover .row,.oB .rows:focus-within .row{animation-play-state:paused}
.oB .bn{font-size:var(--fs-52);padding-inline:.25em}
@keyframes mqL{to{transform:translateX(-50%)}}
@keyframes mqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* C · photo tiles */
.oC ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.oC li:first-child{grid-column:span 2}
.oC li:first-child .tile{aspect-ratio:2/1}   /* 2 + 10 tiles = three full rows of four */
.tile{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--neutral-950);text-decoration:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.tile:hover img,.tile:focus-visible img{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(9,9,11,.75))}
.tile .t{position:absolute;inset-inline:16px;bottom:14px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tile .t b{display:block;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.tile .t .msi{font-size:var(--fs-24);transition:transform .3s var(--ease)}
.tile:hover .t .msi{transform:translateX(4px)}
[dir=rtl] .tile .t .msi{scale:-1 1}
.noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--color-brand);font-size:var(--fs-52)}
.noimg .msi,.noimg .mi{font-size:var(--fs-52)}

/* D · expanding strips */
.oD .strips{display:flex;gap:6px;height:clamp(380px,56vh,520px)}
.strip{position:relative;flex:1 1 0;min-width:0;overflow:hidden;background:var(--neutral-950);text-decoration:none;transition:flex-grow .6s var(--ease)}
.strip:hover,.strip:focus-visible,.strip.on{flex-grow:6}
.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.55);transition:filter .6s var(--ease)}
.strip:hover img,.strip:focus-visible img,.strip.on img{filter:none}
.strip .v{position:absolute;inset-inline-start:50%;bottom:16px;z-index:1;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font:var(--ts-title-body);text-transform:var(--type-case-title);white-space:nowrap;transition:opacity .3s}
[dir=rtl] .strip .v{transform:translateX(50%) rotate(180deg)}
.strip .w{position:absolute;inset-inline:20px;bottom:18px;z-index:1;opacity:0;transform:translateY(12px);transition:opacity .3s .15s,transform .5s var(--ease) .15s}
.strip .w b{display:block;font:var(--ts-display-xs);text-transform:var(--type-case-display)}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(9,9,11,.7))}
.strip:hover .v,.strip:focus-visible .v,.strip.on .v{opacity:0}
.strip:hover .w,.strip:focus-visible .w,.strip.on .w{opacity:1;transform:none}

/* E · numbered rows that reveal a photo */
.oE ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,auto);grid-auto-flow:column;column-gap:clamp(24px,4vw,64px);margin:0;padding:0;list-style:none}
.oE li:first-child,.oE li:nth-child(7){border-top:1px solid rgba(255,255,255,.3)}
.ix{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;align-items:center;gap:24px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.3);text-decoration:none;transition:padding .4s var(--ease),background-color .3s}
.ix .n{font:var(--ts-body-default-bold);opacity:.7}
.ix .nm{font-family:var(--type-font);font-weight:var(--type-w-title);font-size:var(--fs-40);line-height:1.05;text-transform:var(--type-case-title)}
.ix .ph{width:0;height:56px;overflow:hidden;transition:width .5s var(--ease)}
.ix .ph img{width:120px;height:56px;object-fit:cover;display:block}
.ix .msi{font-size:var(--fs-28);transition:transform .3s var(--ease)}
[dir=rtl] .ix .msi{scale:-1 1}
.ix:hover,.ix:focus-visible{background:var(--neutral-950);padding-inline:16px}
.ix:hover .ph,.ix:focus-visible .ph{width:120px}
.ix:hover .msi{transform:translateX(6px)}

/* F · still list beside one big photo */
.oF .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(32px,5vw,80px);align-items:stretch}
.oF ul{margin:0;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.3)}
.oF li a{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.3);text-decoration:none;font:var(--ts-title-body);text-transform:var(--type-case-title);color:rgba(255,255,255,.65);transition:color .25s,padding .35s var(--ease)}
.oF li a .cnt{opacity:1}
.oF li a:hover,.oF li a:focus-visible,.oF li a.on{color:var(--neutral-0);padding-inline-start:12px}
.oF .stage{position:relative;min-height:420px;background:var(--neutral-950);overflow:hidden}
.oF .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.05);transition:opacity .45s,transform .9s var(--ease)}
.oF .stage img.on{opacity:1;transform:none}
.oF .stage .noimg{opacity:0;transition:opacity .45s}
.oF .stage .noimg.on{opacity:1}
.oF .cap{position:absolute;inset-inline-start:16px;bottom:16px;z-index:2;padding:6px 10px;background:var(--neutral-950);font:var(--ts-body-default-bold);text-transform:var(--type-case-label)}

/* G · photo cards you drag or step through (f/hscroll.js) */
.hs{display:flex;align-items:center;gap:8px;min-width:0}
.hs > :not(.hs-arr){flex:1 1 auto;min-width:0}
.hs-arr{flex:none;display:grid;place-items:center;width:48px;height:48px;padding:0;border:1px solid rgba(255,255,255,.5);background:none;color:var(--neutral-0);cursor:pointer;transition:border-color .2s,opacity .2s,background-color .2s}
.hs-arr:hover:not(:disabled){border-color:var(--neutral-0);background:var(--neutral-950)}
.hs-arr:disabled{opacity:.35;cursor:default}
.hs:not(.ovf) .hs-arr{display:none}
.hs-i{display:block;width:8px;height:14px;background:currentColor;-webkit-mask:url(f/flow/chevron-left.svg) center/contain no-repeat;mask:url(f/flow/chevron-left.svg) center/contain no-repeat}
.hs-arr.fwd .hs-i,[dir=rtl] .hs-arr:not(.fwd) .hs-i{scale:-1 1}
[dir=rtl] .hs-arr.fwd .hs-i{scale:none}
.hs-drag{cursor:grabbing;user-select:none;-webkit-user-select:none}
.oG .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:32px}
.oG .hd .h{margin:0}
.oG .cards{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.oG .cards::-webkit-scrollbar{display:none}
.oG .cards > a{scroll-snap-align:start;flex:none;width:clamp(240px,22vw,320px);aspect-ratio:3/4;position:relative;overflow:hidden;background:var(--neutral-950);text-decoration:none}
.oG .cards img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);-webkit-user-drag:none}
.oG .cards > a:hover img{transform:scale(1.05)}
.oG .cards > a::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(9,9,11,.8))}
.oG .cards .t{position:absolute;inset-inline:20px;bottom:20px;z-index:1;display:grid;gap:4px}
.oG .cards .t b{font:var(--ts-title-section);text-transform:var(--type-case-title)}
.oG .cards .no{position:absolute;top:20px;inset-inline-start:20px;z-index:1;font:var(--ts-body-default-bold);opacity:.7}
.oG .row-hs{direction:inherit}

/* H · icon grid */
.oH ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.3);border-inline-start:1px solid rgba(255,255,255,.3)}
.oH li{border-bottom:1px solid rgba(255,255,255,.3);border-inline-end:1px solid rgba(255,255,255,.3)}
.oH a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:28px 24px;text-decoration:none;transition:background-color .25s,color .25s}
.oH .ic{display:grid;place-items:center;width:64px;height:64px;border:1px solid rgba(255,255,255,.5);font-size:var(--fs-32);transition:border-color .25s,background-color .25s}
.oH .ic .msi{font-size:var(--fs-32)}
.oH b{display:block;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.oH .msi.go{font-size:var(--fs-24);opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .35s var(--ease)}
[dir=rtl] .oH .msi.go{scale:-1 1;transform:translateX(8px)}
.oH a:hover,.oH a:focus-visible{background:var(--neutral-950)}
.oH a:hover .ic,.oH a:focus-visible .ic{background:var(--color-brand);border-color:var(--color-brand)}
.oH a:hover .msi.go,.oH a:focus-visible .msi.go{opacity:1;transform:none}

/* I · one big rotating word with its photo */
.oI .stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.oI .play{margin:0;font-family:var(--type-font);font-weight:var(--type-w-title);font-size:clamp(48px,7.5vw,112px);line-height:.95;text-transform:var(--type-case-display)}
.oI .play span{display:block}
.oI .word{position:relative;display:block;height:1.3em;overflow:hidden;color:var(--neutral-950)}   /* room for Arabic letters above and below */
.oI .word a{position:absolute;inset:0;line-height:1.3;text-decoration:none;white-space:nowrap;transform:translateY(110%);transition:transform .7s var(--ease)}
.oI .word a.on{transform:none}
.oI .word a.out{transform:translateY(-110%)}
.oI .pic{position:relative;aspect-ratio:4/5;max-height:520px;overflow:hidden;background:var(--neutral-950)}
.oI .pic img,.oI .pic .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.oI .pic .on{opacity:1}
.oI .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.oI .chips button{height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.5);background:none;color:var(--neutral-0);font:var(--ts-body-s-bold);cursor:pointer}
.oI .chips button:hover{border-color:var(--neutral-0)}
.oI .chips button[aria-pressed=true]{background:var(--neutral-950);border-color:var(--neutral-950)}
.oI .bar2{height:2px;margin-top:16px;background:rgba(255,255,255,.3)}
.oI .bar2 i{display:block;height:100%;width:0;background:var(--neutral-0)}
.oI .bar2 i.run{width:100%;transition:width 3s linear}

/* J · bento */
/* a fixed layout so the nine tiles fill four full rows */
.oJ ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,14vw,210px);gap:8px;margin:0;padding:0;list-style:none;
  grid-template-areas:"football football basketball basketball" "football football badminton padel" "futsal handball rugby padel" "tennis tennis other other"}
.oJ .k-football{grid-area:football}.oJ .k-basketball{grid-area:basketball}.oJ .k-badminton{grid-area:badminton}.oJ .k-padel{grid-area:padel}
.oJ .k-futsal{grid-area:futsal}.oJ .k-handball{grid-area:handball}.oJ .k-rugby{grid-area:rugby}.oJ .k-tennis{grid-area:tennis}.oJ .k-other{grid-area:other}
.oJ li > a{position:relative;display:block;height:100%;overflow:hidden;background:var(--neutral-950);text-decoration:none}
.oJ img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.oJ a:hover img{transform:scale(1.05)}
.oJ a::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(9,9,11,.75))}
.oJ .t{position:absolute;inset-inline:16px;bottom:14px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.oJ .t b{display:block;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.oJ .k-football .t b{font:var(--ts-display-s);text-transform:var(--type-case-display)}
.oJ .solid{display:flex;flex-direction:column;justify-content:space-between;padding:16px;background:var(--neutral-950)}
.oJ .solid::after{content:none}
.oJ .solid .ic{font-size:var(--fs-40);color:var(--color-brand)}
.oJ .solid .ic .msi{font-size:var(--fs-40)}
.oJ .solid .t{position:static}
.oJ .mem{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font:var(--ts-body-s);opacity:.75}

/* K · stacking cards as you scroll */
.sec.oK{overflow:clip}   /* hidden would make the section a scroll box and stop the sticky title and cards */
.oK .split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,5vw,80px);align-items:start}
.oK .side{position:sticky;top:96px}
.oK .side p{margin:0;max-width:36ch;font:var(--ts-body-l);opacity:.85}
.oK ol{margin:0;padding:0;list-style:none;display:grid;gap:24px}
.oK li{position:sticky;top:calc(96px + var(--i) * 12px)}
.oK li > a{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:clamp(260px,30vw,360px);overflow:hidden;background:var(--neutral-950);text-decoration:none;box-shadow:0 -12px 32px -12px rgba(0,0,0,.45)}
.oK .ph{position:relative;overflow:hidden}
.oK .ph img,.oK .ph .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oK .tx{display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.oK .tx .n{font:var(--ts-body-default-bold);opacity:.6}
.oK .tx b{display:block;font:var(--ts-display-s);text-transform:var(--type-case-display)}
.oK .tx .go{display:inline-flex;align-items:center;gap:8px;font:var(--ts-body-default-bold)}
[dir=rtl] .oK .tx .go .msi{scale:-1 1}

/* L · tabs and one feature panel */
.oL .tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.3)}
.oL .tabs::-webkit-scrollbar{display:none}
.oL .tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:none;color:rgba(255,255,255,.7);font:var(--ts-body-default-bold);cursor:pointer;margin-bottom:-1px}
.oL .tabs button .msi,.oL .tabs button .mi{font-size:var(--fs-20)}
.oL .tabs button:hover{color:var(--neutral-0)}
.oL .tabs button[aria-selected=true]{color:var(--neutral-0);border-bottom-color:var(--neutral-950)}
.oL .panel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);margin-top:24px;background:var(--neutral-950);min-height:400px}
.oL .panel .ph{position:relative;overflow:hidden;min-height:320px}
.oL .panel .ph img,.oL .panel .ph .noimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oL .panel .tx{display:flex;flex-direction:column;gap:16px;padding:clamp(24px,3vw,40px)}
.oL .panel h3{margin:0;font:var(--ts-display-s);text-transform:var(--type-case-display)}
.oL dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;margin:0;font:var(--ts-body-default)}
.oL dt{color:var(--neutral-400)}
.oL dd{margin:0;font:var(--ts-body-default-bold)}
.oL .cta{align-self:start;display:inline-flex;align-items:center;gap:8px;height:52px;margin-top:auto;padding:0 24px;background:var(--color-brand);color:var(--neutral-0);font:var(--ts-body-default-bold);text-decoration:none}
.oL .cta:hover{filter:brightness(.92)}
[dir=rtl] .oL .cta .msi{scale:-1 1}
.oL .smp{align-self:start;padding:4px 8px;background:var(--color-warning-bg);color:var(--color-warning-content);font:var(--ts-caption-1-bold)}

@media (max-width:820px){
  .oG .hd .hs-nav{display:none}
  .oG .cards > a{width:72vw}
  .oH ul{grid-template-columns:minmax(0,1fr)}
  .oH a{padding:18px 16px}
  .oH .ic{width:48px;height:48px}
  .oH .msi.go{opacity:1;transform:none}
  .oI .stage{grid-template-columns:minmax(0,1fr)}
  .oI .pic{aspect-ratio:4/3;order:-1}
  .oJ ul{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:160px}
  .oJ ul{grid-template-areas:"football football" "football football" "basketball basketball" "badminton padel" "futsal handball" "rugby rugby" "tennis tennis" "other other"}
  .oJ .k-football .t b{font:var(--ts-title-section)}
  .oK .split{grid-template-columns:minmax(0,1fr)}
  .oK .side{position:static}
  .oK li{top:calc(72px + var(--i) * 8px)}
  .oK li > a{grid-template-columns:minmax(0,1fr);grid-template-rows:180px auto;height:auto}
  .oL .panel{grid-template-columns:minmax(0,1fr)}
  .oL .panel .ph{min-height:220px}
  .oA ul{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}
  .bn{font-size:var(--fs-32);white-space:normal}
  .oB .bn{font-size:var(--fs-40);white-space:nowrap}
  .peek{display:none}
  .oC ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  .oD .strips{flex-direction:column;height:auto;gap:4px}
  .strip{flex:none;height:64px;transition:height .6s var(--ease)}
  .strip.on{height:260px}
  .strip .v{writing-mode:horizontal-tb;transform:none;inset-inline-start:16px;bottom:50%;translate:0 50%}
  [dir=rtl] .strip .v{transform:none}
  .oE ul{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}.oE li:nth-child(7){border-top:0}
  .ix{grid-template-columns:36px minmax(0,1fr) auto;gap:12px}
  .ix .ph{display:none}
  .ix .nm{font-size:var(--fs-28)}
  .oF .split{grid-template-columns:minmax(0,1fr)}
  .oF .stage{min-height:260px;order:-1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar" aria-label="Options"><b>Sports section</b>
  <a href="#A"><i>A</i>Two columns (now)</a><a href="#B"><i>B</i>Moving rows</a><a href="#C"><i>C</i>Photo tiles</a>
  <a href="#D"><i>D</i>Expanding strips</a><a href="#E"><i>E</i>Numbered list</a><a href="#F"><i>F</i>List + photo</a>
  <a href="#G"><i>G</i>Card carousel</a><a href="#H"><i>H</i>Icon grid</a><a href="#I"><i>I</i>Rotating word</a>
  <a href="#J"><i>J</i>Bento</a><a href="#K"><i>K</i>Stacking cards</a><a href="#L"><i>L</i>Tabs + panel</a>
  <button type="button" class="lang" data-lang-toggle lang="ar">عربي</button>
</nav>
<main id="opts"></main>

<script src="f/courts-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/hscroll.js"></script>
<script>
(() => {
  const P = window.SFA_PREFS, t = P.t, S = window.SFA_SPORTS;
  // the home page's list: the system's sports, with volleyball, netball, GFX and table tennis under Other sports
  const KEYS = ['basketball', 'badminton', 'football', 'futsal', 'handball', 'padel', 'rugby', 'tennis', 'other'];
  const GR = window.SFA_SPORT_GROUPS, info = k => window.SFA_SPORT_INFO(k);
  const NO_PHOTO = new Set(['handball', 'other']);   // handball's photo was removed (Ahmed, 2026-11-19); a group has none
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const name = k => esc(t(info(k).name));
  const url = k => `courts.html?sport=${k}`;
  const photo = k => NO_PHOTO.has(k) ? '' : k === 'padel' ? 'f/courts/padel.jpg' : `f/sports-photos/${k}.jpg`;
  const icon = k => info(k).img ? `<span class="mi" style="--m:url(${info(k).img})"></span>` : `<span class="msi">${info(k).icon}</span>`;
  // real courts only: football's 7-a-side setup joins two fields, so it isn't counted again; rugby uses those two fields
  const courts = k => { if (GR[k]) return t('{n} sports', { n: GR[k].members.length });
    const n = S[k].courts.filter(c => !c[0].includes('+')).length || 2;
    return S[k].area === 'field' ? t('{n} fields', { n }) : n === 1 ? t('1 court') : t('{n} courts', { n }); };
  const members = k => GR[k] ? GR[k].members.map(m => esc(t(S[m].name))) : [];
  const fromPrice = k => { const list = GR[k] ? GR[k].members : [k]; return Math.min(...list.flatMap(m => S[m].courts.map(c => c[5]))) * 1.5; };
  const formats = k => GR[k] ? members(k).join(', ') : [...new Set(S[k].courts.map(c => t(c[3])))].map(esc).join(' · ');
  const media = (k, cls = '') => photo(k) ? `<img src="${photo(k)}" alt="" loading="lazy"${cls ? ` class="${cls}"` : ''}>` : `<span class="noimg${cls ? ' ' + cls : ''}" aria-hidden="true">${icon(k)}</span>`;
  const ARROW = '<span class="msi" aria-hidden="true">arrow_forward</span>';
  const H = `<h2 class="h">${t('Every game one dome is waiting')}</h2>`;
  const label = (id, title, note) => `<div class="lbl"><i>${id}</i><b>${title}</b><span>${note}</span></div>`;
  const opts = [
    ['A', 'Two columns, banner style', 'What the home page has now. Hover a name for its photo at the cursor.',
      () => `<div class="sec oA" data-peek><div class="in">${H}<ul>${KEYS.map((k, i) => `<li><a class="bn${i >= 6 ? ' fill' : ''}" href="${url(k)}" data-k="${k}">${name(k)}</a></li>`).join('')}</ul></div><div class="peek" aria-hidden="true"><img alt=""><b></b></div></div>`],
    ['B', 'Moving rows', 'The footer banner itself: two rows drifting in opposite directions; hover pauses them and shows the photo.',
      () => { const half = [KEYS.slice(0, 6), KEYS.slice(6)], row = (list, fill) => [...list, ...list, ...list, ...list].map((k, i) => `<a class="bn${fill ? ' fill' : ''}" href="${url(k)}" data-k="${k}"${i >= list.length ? ' tabindex="-1" aria-hidden="true"' : ''}>${name(k)}</a>`).join('');
        return `<div class="sec oB" data-peek><div class="in">${H}</div><div class="rows"><div class="row">${row(half[0], false)}</div><div class="row r2">${row(half[1], true)}</div></div><div class="peek" aria-hidden="true"><img alt=""><b></b></div></div>`; }],
    ['C', 'Photo tiles', 'Every sport as a photo tile with its court count; the first one is wide. Works the same on touch.',
      () => `<div class="sec oC"><div class="in">${H}<ul>${KEYS.map(k => `<li><a class="tile" href="${url(k)}">${media(k)}<span class="t"><span><b>${name(k)}</b><span class="cnt">${courts(k)}</span></span>${ARROW}</span></a></li>`).join('')}</ul></div></div>`],
    ['D', 'Expanding strips', 'Eleven slim strips; the one you point at (or tap) opens to show its photo. Stacks on phones.',
      () => `<div class="sec oD"><div class="in">${H}<div class="strips">${KEYS.map((k, i) => `<a class="strip${i === 0 ? ' on' : ''}" href="${url(k)}" data-k="${k}">${media(k)}<span class="v" aria-hidden="true">${name(k)}</span><span class="w"><b>${name(k)}</b><span class="cnt">${courts(k)}</span></span></a>`).join('')}</div></div></div>`],
    ['E', 'Numbered list', 'Numbered rows in two columns; hovering one darkens it and slides its photo in beside the arrow.',
      () => `<div class="sec oE"><div class="in">${H}<ul>${KEYS.map((k, i) => `<li><a class="ix" href="${url(k)}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="nm">${name(k)}</span><span class="ph" aria-hidden="true">${photo(k) ? `<img src="${photo(k)}" alt="" loading="lazy">` : ''}</span>${ARROW}</a></li>`).join('')}</ul></div></div>`],
    ['F', 'List and one big photo', 'A still list with court counts beside one large photo that changes with the sport you point at.',
      () => `<div class="sec oF"><div class="in">${H}<div class="split"><ul>${KEYS.map((k, i) => `<li><a href="${url(k)}" data-k="${k}"${i === 0 ? ' class="on"' : ''}><span>${name(k)}</span><span class="cnt">${courts(k)}</span></a></li>`).join('')}</ul>
        <div class="stage">${KEYS.map((k, i) => media(k, `ph-${k}${i === 0 ? ' on' : ''}`)).join('')}<span class="cap">${name(KEYS[0])}</span></div></div></div></div>`],
    ['G', 'Card carousel', 'Tall photo cards in one row: drag, swipe or use the arrows. Each card shows its court count.',
      () => `<div class="sec oG"><div class="in"><div class="hd">${H}<div class="hs-nav"></div></div><div class="cards">${KEYS.map((k, i) => `<a href="${url(k)}">${media(k)}<span class="no">${String(i + 1).padStart(2, '0')}</span><span class="t"><b>${name(k)}</b><span class="cnt">${courts(k)}</span></span></a>`).join('')}</div></div></div>`],
    ['H', 'Icon grid', 'No photos: a 3 × 3 grid of sport icons with court counts. Pointing at one turns it dark. Works for Handball and Other sports too.',
      () => `<div class="sec oH"><div class="in">${H}<ul>${KEYS.map(k => `<li><a href="${url(k)}"><span class="ic" aria-hidden="true">${icon(k)}</span><span><b>${name(k)}</b><span class="cnt">${courts(k)}</span></span><span class="msi go" aria-hidden="true">arrow_forward</span></a></li>`).join('')}</ul></div></div>`],
    ['I', 'Rotating word', '"Play ___" with the sport word changing every 3 seconds and its photo beside it. The chips pick one and stop the rotation.',
      () => `<div class="sec oI"><div class="in">${H}<div class="stage"><div><p class="play"><span>${P.lang === 'ar' ? 'العب' : 'Play'}</span><span class="word">${KEYS.map((k, i) => `<a href="${url(k)}" data-k="${k}"${i === 0 ? ' class="on"' : ' tabindex="-1" aria-hidden="true"'}>${name(k)}</a>`).join('')}</span></p><div class="bar2" aria-hidden="true"><i></i></div>
        <div class="chips" role="group" aria-label="${t('Sport')}">${KEYS.map((k, i) => `<button type="button" data-k="${k}" aria-pressed="${i === 0}">${name(k)}</button>`).join('')}</div></div>
        <div class="pic" aria-hidden="true">${KEYS.map((k, i) => media(k, `ph-${k}${i === 0 ? ' on' : ''}`)).join('')}</div></div></div></div>`],
    ['J', 'Bento', 'Mixed tile sizes: Football is the big one. Handball and Other sports are dark icon tiles, and Other sports lists what it covers.',
      () => `<div class="sec oJ"><div class="in">${H}<ul>${KEYS.map(k => `<li class="k-${k}">${photo(k)
        ? `<a href="${url(k)}"><img src="${photo(k)}" alt="" loading="lazy"><span class="t"><span><b>${name(k)}</b><span class="cnt">${courts(k)}</span></span>${ARROW}</span></a>`
        : `<a class="solid" href="${url(k)}"><span class="ic" aria-hidden="true">${icon(k)}</span><span class="t"><span><b>${name(k)}</b>${GR[k] ? `<span class="mem">${members(k).map(m => `<span>${m}</span>`).join('')}</span>` : `<span class="cnt">${courts(k)}</span>`}</span>${ARROW}</span></a>`}</li>`).join('')}</ul></div></div>`],
    ['K', 'Stacking cards', 'The title stays put while each sport card slides up and stacks on the one before as you scroll.',
      () => `<div class="sec oK"><div class="in"><div class="split"><div class="side">${H}<p>${t('Nine ways to play under one roof. Pick a sport to see its courts and book a 1.5-hour session.')}</p></div>
        <ol>${KEYS.map((k, i) => `<li style="--i:${i}"><a href="${url(k)}"><span class="ph">${media(k)}</span><span class="tx"><span class="n">${String(i + 1).padStart(2, '0')} / ${String(KEYS.length).padStart(2, '0')}</span><span><b>${name(k)}</b><span class="cnt">${courts(k)}</span></span><span class="go">${t('See courts')}${ARROW}</span></span></a></li>`).join('')}</ol></div></div></div>`],
    ['L', 'Tabs and a feature panel', 'A tab per sport; the panel shows its photo, courts, formats and the starting price per session, with a button to its courts.',
      () => `<div class="sec oL"><div class="in">${H}<div class="tabs" role="tablist" aria-label="${t('Sport')}">${KEYS.map((k, i) => `<button type="button" role="tab" id="tab-${k}" data-k="${k}" aria-selected="${i === 0}" aria-controls="lPanel"${i ? ' tabindex="-1"' : ''}><span aria-hidden="true">${icon(k)}</span>${name(k)}</button>`).join('')}</div>
        <div class="panel" id="lPanel" role="tabpanel" aria-labelledby="tab-${KEYS[0]}">${lPanel(KEYS[0])}</div></div></div>`],
  ];
  function lPanel(k){
    return `<div class="ph">${media(k)}</div><div class="tx">${info(k).sample ? `<span class="smp">${t('Sample')}</span>` : ''}<h3>${name(k)}</h3>
      <dl><dt>${GR[k] ? t('Sports') : t('Courts')}</dt><dd>${courts(k)}</dd><dt>${GR[k] ? t('Includes') : t('Format')}</dt><dd>${formats(k)}</dd><dt>${t('From')}</dt><dd>${P.money(fromPrice(k))} ${t('/ session')}</dd></dl>
      <a class="cta" href="${url(k)}">${t('See courts')}${ARROW}</a></div>`;
  }
  const root = document.getElementById('opts');
  let paint = function(){
    document.title = `${t('Sports section options')} · SFA Domes`;
    root.innerHTML = opts.map(([id, title, note, html]) => `<section class="opt" id="${id}" aria-label="${t('Option {x}', { x: id })}">${label(id, title, note)}${html()}</section>`).join('');
    wire();
  }
  const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  function wire(){
    // the photo at the cursor (A, B)
    root.querySelectorAll('[data-peek]').forEach(sec => {
      const peek = sec.querySelector('.peek'), img = peek.querySelector('img'), tag = peek.querySelector('b');
      const move = e => { const r = sec.getBoundingClientRect(); peek.style.left = e.clientX - r.left + 'px'; peek.style.top = e.clientY - r.top + 'px'; };
      if (!canHover) return;
      sec.querySelectorAll('a[data-k]').forEach(a => {
        a.addEventListener('pointerenter', e => { const k = a.dataset.k; if (!photo(k)){ peek.classList.remove('on'); return; } img.src = photo(k); tag.textContent = a.textContent; move(e); peek.classList.add('on'); });
        a.addEventListener('pointermove', move);
        a.addEventListener('pointerleave', () => peek.classList.remove('on'));
      });
    });
    // D: one strip open at a time (hover, focus or a first tap on touch)
    const strips = [...root.querySelectorAll('.strip')];
    const openStrip = s => strips.forEach(x => x.classList.toggle('on', x === s));
    strips.forEach(s => {
      s.addEventListener('pointerenter', () => canHover && openStrip(s));
      s.addEventListener('focus', () => openStrip(s));
      s.addEventListener('click', e => { if (!canHover && !s.classList.contains('on')){ e.preventDefault(); openStrip(s); } });
    });
    // F: the photo follows the sport you point at or focus
    const F = root.querySelector('.oF');
    if (F){ const cap = F.querySelector('.cap'), links = [...F.querySelectorAll('a[data-k]')];
      const pick = a => { links.forEach(x => x.classList.toggle('on', x === a)); F.querySelectorAll('.stage > img, .stage > .noimg').forEach(m => m.classList.toggle('on', m.classList.contains('ph-' + a.dataset.k))); cap.textContent = a.querySelector('span').textContent; };
      links.forEach(a => { a.addEventListener('pointerenter', () => pick(a)); a.addEventListener('focus', () => pick(a)); a.addEventListener('click', e => { if (!canHover && !a.classList.contains('on')){ e.preventDefault(); pick(a); } }); }); }
  }
  let rot = null;
  function wireNew(){
    // G: arrows and drag on the card row; the arrows sit beside the heading on desktop
    const G = root.querySelector('.oG');
    if (G){ const row = G.querySelector('.cards'); window.SFA_HSCROLL(row, { prev: t('Previous'), next: t('Next') });
      const hs = row.parentElement, nav = G.querySelector('.hs-nav'); nav.className = 'hs-nav hs'; nav.append(...hs.querySelectorAll('.hs-arr'));
      const sync = () => nav.classList.toggle('ovf', hs.classList.contains('ovf')); new MutationObserver(sync).observe(hs, { attributes: true }); sync(); }
    // I: the word turns over every 3 s until someone picks a chip; reduced motion shows the first and waits for a pick
    const I = root.querySelector('.oI'); clearInterval(rot);
    if (I){ const words = [...I.querySelectorAll('.word a')], chips = [...I.querySelectorAll('.chips button')], pics = [...I.querySelectorAll('.pic > *')], bar = I.querySelector('.bar2 i');
      let cur = 0;
      // the old word slides up and out; once it's gone it jumps back below without a transition, ready for its next turn
      const show = (n, auto) => { if (n === cur) return; const old = words[cur];
        old.classList.remove('on'); old.classList.add('out'); old.tabIndex = -1; old.setAttribute('aria-hidden', 'true');
        const w = words[n]; w.classList.remove('out'); w.classList.add('on'); w.removeAttribute('tabindex'); w.removeAttribute('aria-hidden');
        setTimeout(() => { if (old.classList.contains('on')) return; old.style.transition = 'none'; old.classList.remove('out'); void old.offsetWidth; old.style.transition = ''; }, 750);
        pics.forEach((p, j) => p.classList.toggle('on', j === n)); chips.forEach((c, j) => c.setAttribute('aria-pressed', String(j === n))); cur = n;
        if (auto){ bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run'); } };
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!still){ bar.classList.add('run'); rot = setInterval(() => show((cur + 1) % words.length, true), 3000); }
      chips.forEach((c, j) => c.addEventListener('click', () => { clearInterval(rot); bar.classList.remove('run'); show(j); })); }
    // L: tabs with arrow keys; the panel redraws for the chosen sport
    const L = root.querySelector('.oL');
    if (L){ const tabs = [...L.querySelectorAll('[role=tab]')], panel = L.querySelector('#lPanel');
      const sel = (b, focus) => { tabs.forEach(x => { const on = x === b; x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1; }); panel.setAttribute('aria-labelledby', b.id); panel.innerHTML = lPanel(b.dataset.k); if (focus) b.focus(); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };
      tabs.forEach((b, j) => { b.addEventListener('click', () => sel(b));
        b.addEventListener('keydown', e => { const rtl = document.documentElement.dir === 'rtl', d = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1, Home: -j, End: tabs.length - 1 - j }[e.key]; if (d === undefined) return; e.preventDefault(); sel(tabs[(j + d + tabs.length) % tabs.length], true); }); }); }
  }
  const paint0 = paint;
  paint = () => { paint0(); wireNew(); };
  paint();
  addEventListener('sfa:prefs', paint);
})();
</script>
