<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My account · SFA Domes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="f/tickets.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=fitness_center,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<style>
/* My account: the signed-in player's tickets (next one up front with its QR, then upcoming and past sessions; each
   opens as a full ticket), saved courts and account details. Tabs follow the URL hash (#tickets, #saved, #account), so
   the account menu and the booking confirmation can link straight to a tab. Tickets come from /api/auth/bookings.
   Design-system tokens only (f/fonts.css text styles, f/colors.css); square corners. */
:root{color-scheme:light;--nav:90px;--g:clamp(16px,6.67vw,96px);--ease:cubic-bezier(.22,1,.36,1);--max:1440px;--tk-hole:var(--color-bg-primary)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg-primary);color:var(--color-content-primary);font:var(--ts-body-m);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--color-brand);outline-offset:3px}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
img{display:block}
[hidden]{display:none!important}
@keyframes up{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
.in{max-width:var(--max);margin:0 auto;padding-inline:var(--g)}

/* head: who you are, then the tabs */
.pf-head{padding-top:calc(var(--nav) + clamp(28px,5vh,56px));border-bottom:1px solid var(--color-border-primary)}
.who{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 24px;animation:up .7s var(--ease) both}
.av{grid-row:span 3;display:grid;place-items:center;width:clamp(72px,8vw,96px);aspect-ratio:1;background:var(--color-brand);color:var(--neutral-0);font:var(--ts-number-m)}
.eye{margin:0;font:var(--ts-label-m);color:var(--color-content-tertiary)}
h1{margin:0;font:var(--ts-display-l);text-transform:var(--type-case-display);overflow-wrap:anywhere}
.meta{margin:0;font:var(--ts-body-s);color:var(--color-content-secondary);overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;margin-top:clamp(24px,4vh,40px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 16px;border:0;background:none;color:var(--color-content-secondary);font:var(--ts-label-l);text-transform:var(--type-case-label);white-space:nowrap;cursor:pointer}
.tab b{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 8px;background:var(--color-bg-secondary);font:var(--ts-label-s);color:var(--color-content-secondary)}
.tab:hover{color:var(--color-content-primary)}
.tab[aria-selected=true]{color:var(--color-content-primary)}
.tab[aria-selected=true] b{background:var(--color-brand);color:var(--neutral-0)}
.tab::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:3px;background:var(--color-brand);scale:0 1;transition:scale .35s var(--ease)}
.tab[aria-selected=true]::after{scale:1 1}

.panel{padding-block:clamp(28px,5vh,48px) clamp(56px,9vh,96px)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 16px}
.sec h2{margin:0;font:var(--ts-title-m);text-transform:var(--type-case-title)}
.sec span{font:var(--ts-label-m);color:var(--color-content-tertiary)}

/* tickets: next one up front, then a segmented list */
.next{margin-bottom:clamp(32px,6vh,56px);animation:up .7s var(--ease) .1s both}
.next .sec h2::before{content:"";display:inline-block;width:10px;height:10px;margin-inline-end:8px;background:var(--color-brand);vertical-align:2px}
.when{font:var(--ts-label-m);color:var(--color-brand)!important}
.seg{display:inline-flex;gap:2px;padding:3px;margin-bottom:16px;background:var(--color-bg-secondary)}
.seg button{height:40px;padding:0 16px;border:0;background:none;color:var(--color-content-secondary);font:var(--ts-label-m);cursor:pointer}
/* selected = the plan card's style everywhere: 2px brand, tint, ink text */
.seg button[aria-pressed=true]{background:var(--color-bg-accent-subtle);color:var(--color-content-primary);box-shadow:inset 0 0 0 2px var(--color-brand)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--color-border-primary)}
.row{position:relative;display:grid;grid-template-columns:76px 120px minmax(0,1fr) auto;align-items:center;gap:20px;padding:16px 8px;border-bottom:1px solid var(--color-border-primary);animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0) * .04s);transition:background-color .2s}
.row:hover{background:var(--color-bg-secondary)}
.row button.open{position:absolute;inset:0;z-index:1;width:100%;padding:0;border:0;background:none;cursor:pointer}
.day{display:grid;justify-items:center;padding:8px 0;border:1px solid var(--color-border-secondary);text-align:center}
.day b{font:var(--ts-number-m)}
.day span,.day small{font:var(--ts-label-s);color:var(--color-content-tertiary);text-transform:uppercase}
html[lang=ar] .day span,html[lang=ar] .day small{text-transform:none}
.thumb{width:120px;aspect-ratio:4/3;overflow:hidden;background:var(--color-bg-tertiary)}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{display:grid;gap:4px;min-width:0}
.info strong{font:var(--ts-title-s);text-transform:var(--type-case-title)}
.info span{font:var(--ts-body-s);color:var(--color-content-secondary)}
.end{display:flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 8px;font:var(--ts-label-s);background:var(--color-bg-secondary);color:var(--color-content-secondary)}
.chip.up{background:var(--color-bg-accent-subtle);color:var(--color-content-accent)}
.go{display:inline-flex;align-items:center;gap:8px;font:var(--ts-label-m)}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;transition:transform .35s var(--ease)}
[dir=rtl] .go svg{scale:-1 1}
.row:hover .go svg{transform:translateX(4px)}
[dir=rtl] .row:hover .go svg{transform:translateX(-4px)}
.past .row{opacity:.72}
/* a program as one row (its tickets open in their own view), with how many sessions are played */
.prog{display:flex;align-items:center;gap:12px}
.prog i{position:relative;flex:none;width:120px;height:4px;background:var(--color-bg-tertiary)}
.prog i::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:calc(var(--p) * 100%);background:var(--color-brand)}
.prog em{font:var(--ts-label-s);font-style:normal;color:var(--color-content-tertiary)}
.prog.big i{width:200px;height:6px}
.prog.big em{font:var(--ts-label-m)}
.pg-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;font:var(--ts-label-m);color:var(--color-content-secondary);text-decoration:none}
.pg-back:hover{color:var(--color-brand)}
.pg-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
[dir=rtl] .pg-back svg{scale:-1 1}
.in-grp .row{grid-template-columns:76px minmax(0,1fr) auto}
.in-grp .thumb{display:none}
.pg-head{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start;margin-bottom:clamp(32px,6vh,56px);padding-bottom:clamp(24px,4vh,40px);border-bottom:1px solid var(--color-border-primary);animation:up .6s var(--ease) both}
.pg-ph{aspect-ratio:4/3;overflow:hidden;background:var(--color-bg-tertiary)}
.pg-ph img{width:100%;height:100%;object-fit:cover}
.pg-in{display:grid;gap:8px;align-content:start}
.pg-in h2{margin:0;font:var(--ts-display-m);text-transform:var(--type-case-display)}
.pg-in .prog{margin-top:8px}
.renew{position:relative;z-index:2;height:32px;padding:0 12px;border:1px solid var(--color-brand);background:var(--color-bg-accent-subtle);color:var(--color-content-accent);font:var(--ts-label-s);cursor:pointer}
.renew:hover{background:var(--color-brand);color:var(--neutral-0)}
.pg-renew{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:8px;padding:16px 20px;border-inline-start:4px solid var(--color-brand);background:var(--color-bg-accent-subtle)}
.pg-renew b{font:var(--ts-label-l)}
.pg-renew p{margin:4px 0 0;font:var(--ts-body-s);color:var(--color-content-secondary)}
.pg-renew s{color:var(--color-content-tertiary)}
.pg-renew strong{color:var(--color-content-primary);font-weight:500}
.pg-renew small{display:block;margin-top:4px;font:var(--ts-caption);color:var(--color-content-tertiary)}
.cx-note{margin:8px 0 0;font:var(--ts-body-s);color:var(--color-content-secondary)}
.cx-note.off{color:var(--color-content-tertiary)}
.cx p{margin:0;font:var(--ts-body-m)}
.cx .err{color:var(--color-danger);font:var(--ts-body-s)}
.cx .err:empty{display:none}
.btn.danger{background:var(--color-danger)}
.btn.danger:hover{filter:brightness(1.08);background:var(--color-danger)}
.types.who{margin-top:-20px}
.pg-note{margin:4px 0 8px;font:var(--ts-body-s);color:var(--color-content-secondary)}
.empty{display:grid;justify-items:start;gap:12px;padding:32px;border:1px dashed var(--color-border-secondary)}
.empty p{margin:0;font:var(--ts-body-m);color:var(--color-content-secondary)}
.empty strong{font:var(--ts-title-s);text-transform:var(--type-case-title)}
.btn,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;font:var(--ts-label-l);text-transform:var(--type-case-label);text-decoration:none;cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
.btn{border:0;background:var(--color-brand);color:var(--neutral-0)}
.btn:hover{background:var(--color-bg-accent-hover)}
.ghost{border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);color:var(--color-content-primary)}
.ghost:hover{background:var(--color-content-primary);border-color:var(--color-content-primary);color:var(--neutral-0)}
.btn svg,.ghost svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}

/* saved courts */
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.st{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--neutral-900);color:var(--neutral-0);isolation:isolate}
.st > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1s var(--ease)}
.st::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,11,.05) 40%,rgba(9,9,11,.8))}
.st:hover > img{transform:scale(1.05)}
.st a{position:absolute;inset:0;z-index:1}
.st .sfa-fav{position:absolute;top:14px;inset-inline-end:14px;z-index:2}
.st-b{position:absolute;inset-inline:18px;bottom:16px;display:grid;gap:2px}
.st-b strong{font:var(--ts-title-s);text-transform:var(--type-case-title)}
.st-b span{font:var(--ts-body-s);color:rgba(255,255,255,.8)}

/* type filter (All / Courts / Training programs / …): square chips, picked = brand, the count of upcoming tickets */
.types{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px}
.type{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);color:var(--color-content-primary);font:var(--ts-label-m);cursor:pointer;transition:border-color .2s,background-color .2s}
.type:hover{border-color:var(--color-content-primary)}
.type b{font:var(--ts-label-s);color:var(--color-content-tertiary)}
.type[aria-pressed=true]{border-color:var(--color-brand);box-shadow:inset 0 0 0 1px var(--color-brand);background:var(--color-bg-accent-subtle);color:var(--color-content-primary)}
.type[aria-pressed=true] b{color:var(--color-content-secondary)}

/* participants */
.pl-lead{margin:-8px 0 16px;max-width:640px}
.pl{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;max-width:760px}
.pl-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:start;gap:16px;padding:16px;border:1px solid var(--color-border-primary);background:var(--color-bg-primary)}
.pl-row.confirm{grid-template-columns:minmax(0,1fr) auto;border-color:var(--color-danger)}
.pl-av{display:grid;place-items:center;width:48px;height:48px;background:var(--color-bg-secondary);font:var(--ts-label-m);color:var(--color-content-secondary)}
.pl-txt{display:grid;gap:4px;min-width:0}
.pl-txt strong{font:var(--ts-label-l)}
.pl-txt strong em{margin-inline-start:8px;padding:2px 8px;background:var(--color-bg-secondary);font:var(--ts-label-s);font-style:normal;color:var(--color-content-secondary)}
.pl-txt > span{font:var(--ts-body-s);color:var(--color-content-secondary)}
.pl-txt .pl-up{color:var(--color-content-accent)}
.pl-q{font:var(--ts-body-m)}
.pl-acts{display:flex;flex-wrap:wrap;gap:8px}
.pl-row > .pl-acts{align-self:center}
.btn.sm,.ghost.sm{height:40px;padding:0 16px;font:var(--ts-label-m)}
.ghost.danger{border-color:var(--color-danger);color:var(--color-danger)}
.ghost.danger:hover{background:var(--color-danger);border-color:var(--color-danger);color:var(--neutral-0)}
.pl-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:760px;height:48px;padding:0 16px;border:1px dashed var(--color-content-tertiary);background:none;color:var(--color-content-primary);font:var(--ts-label-m);cursor:pointer}
.pl-add:hover{border-color:var(--color-content-primary)}
.pl-add svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.pl-form{display:grid;gap:16px;max-width:760px;padding:24px;border:1px solid var(--color-content-primary);background:var(--color-bg-primary)}
.pl-form-h{margin:0;font:var(--ts-label-l)}
.pl-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pf{display:grid;gap:8px;align-content:start}
.pl-two .pf:has(> .dobp-pan:not([hidden])){grid-column:1/-1}   /* the open date-of-birth picker takes the full row */
.pf label,.pf-l{font:var(--ts-label-m);color:var(--color-content-secondary)}
.pf input{height:48px;padding:0 16px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);font:var(--ts-body-m);color:inherit;outline:0}
.pf input:focus{border-color:var(--color-content-primary);box-shadow:inset 0 0 0 1px var(--color-content-primary)}
.pf .err{display:none;margin:0;font:var(--ts-body-s);color:var(--color-danger)}
.pf.bad input,.pf.bad .pl-gen button{border-color:var(--color-danger)}
.pf.bad .err{display:block}
.pl-gen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pl-gen button{height:48px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);font:var(--ts-label-m);cursor:pointer}
.pl-gen button[aria-checked=true]{border-color:var(--color-brand);box-shadow:inset 0 0 0 1px var(--color-brand);background:var(--color-bg-accent-subtle);color:var(--color-content-primary)}

/* My children / My profile extras */
.kids-sec{max-width:760px}
.pf-h{margin:0;font:var(--ts-body-s);color:var(--color-content-tertiary)}
.pf.bad .pf-h{display:none}
.pl-ferr{margin:0;font:var(--ts-body-s);color:var(--color-danger)}
.pl-limit{max-width:760px;margin:0;padding:16px;border:1px dashed var(--color-border-secondary);font:var(--ts-body-s);color:var(--color-content-secondary)}
.lk{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;vertical-align:-2px;margin-inline-start:6px;color:var(--color-content-tertiary)}
.lk-note{display:flex;align-items:center;gap:8px}
.lk-note .lk{margin:0}
.pf.locked label{display:flex;align-items:center}
.pf input:disabled{background:var(--color-bg-secondary);border-color:var(--color-border-primary);color:var(--color-content-secondary);cursor:not-allowed}
.acct .sec{align-items:center}
.empty .btn svg,.pl-add svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}

/* account */
.acct{display:grid;grid-template-columns:minmax(0,640px);gap:24px}
.dl{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);margin:0;border-top:1px solid var(--color-border-primary)}
.dl dt,.dl dd{padding:16px 0;border-bottom:1px solid var(--color-border-primary)}
.dl dt{font:var(--ts-label-m);color:var(--color-content-tertiary)}
.dl dd{margin:0;font:var(--ts-body-m);overflow-wrap:anywhere}
.out{justify-self:start;color:var(--color-danger)!important}
.out:hover{background:var(--color-danger)!important;border-color:var(--color-danger)!important;color:var(--neutral-0)!important}

/* a ticket opened full size */
.dlg{width:min(980px,calc(100vw - 32px));max-height:calc(100svh - 32px);padding:0;border:0;background:var(--color-bg-secondary);color:var(--color-content-primary);--tk-hole:var(--color-bg-secondary)}
.dlg::backdrop{background:rgba(9,9,11,.6)}
.dlg[open]{animation:up .4s var(--ease)}
.dlg-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:var(--color-bg-primary);border-bottom:1px solid var(--color-border-primary)}
.dlg-top h2{margin:0;font:var(--ts-title-s);text-transform:var(--type-case-title)}
.x{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--color-border-secondary);background:none;cursor:pointer}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.dlg-body{display:grid;gap:16px;padding:20px}
.dlg-acts{display:flex;flex-wrap:wrap;gap:8px}
.gate{display:grid;justify-items:center;gap:16px;padding:48px 24px;text-align:center}

@media (max-width:760px){
  .who{grid-template-columns:minmax(0,1fr)}.av{grid-row:auto}
  /* phone rows: date | title, time and when-chip stacked | arrow; the ref lives on the ticket itself */
  .row{grid-template-columns:64px minmax(0,1fr) 24px;align-items:start;gap:8px 16px;padding:16px 0}
  .row .day{grid-row:1/span 2}
  .row .end{display:contents}
  .row .chip{grid-column:2;grid-row:2;justify-self:start}
  .row .go{grid-column:3;grid-row:1/span 2;align-self:center}
  .info strong{font:var(--ts-label-l)}
  .info .ref{display:none}
  .thumb{display:none}
  .row.grp .prog i{width:80px}
  .in-grp .row{grid-template-columns:64px minmax(0,1fr) 24px}
  .pg-head{grid-template-columns:minmax(0,1fr)}
  .pg-ph{aspect-ratio:16/9}
  .pg-in h2{font:var(--ts-title-l)}
  .go span{display:none}
  .pl-row{grid-template-columns:48px minmax(0,1fr);}
  .pl-row > .pl-acts{grid-column:2;align-self:start}
  .types{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--g) * -1);padding-inline:var(--g);scrollbar-width:none}
  .types::-webkit-scrollbar{display:none}
  .type{flex:none}
  .pl-row.confirm{grid-template-columns:minmax(0,1fr)}
  .pl-row.confirm .pl-acts{grid-column:1}
  .pl-two{grid-template-columns:minmax(0,1fr)}
  .pl-form{padding:16px}
  .dl{grid-template-columns:minmax(0,1fr)}.dl dt{padding-bottom:0;border-bottom:0}.dl dd{padding-top:4px}
  .dlg-acts > *{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* hover never hides a selection */
.type[aria-pressed=true]:hover,.pl-gen button[aria-checked=true]:hover{border-color:var(--color-brand)}
</style>
</head>
<body>
<div data-site-nav></div>
<main id="page"></main>
<dialog class="dlg" id="dlg" aria-labelledby="dlgH"></dialog>
<div data-site-footer></div>

<script src="f/site-nav.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/programs-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script src="f/tickets.js"></script>
<script>
(() => {
  const P = window.SFA_PREFS, t = P.t, T = window.SFA_TICKETS, A = window.SFA_AUTH, S = window.SFA_SPORTS;
  const root = document.getElementById('page'), dlg = document.getElementById('dlg');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  }
  // ---- My profile: the details given at sign-up; first and last name, date of birth and gender can change, email and phone are locked
  const phoneTxt = p => p ? `<bdi dir="ltr">${esc(p.replace(/^\+966(\d{2})(\d{3})(\d{4})$/, '+966 $1 $2 $3'))}</bdi>` : '—';
  function account(){
    if (aform){ const f = aform, er = f.errors || {};
      return `<section class="acct" aria-labelledby="acH"><div class="sec"><h2 id="acH">${t('My profile')}</h2></div><div class="pl-form" role="group" aria-labelledby="acH">
        <div class="pl-two">${field('aF', 'First name', f.first, er.first, 'type="text" autocomplete="given-name"')}${field('aL', 'Last name', f.last, er.last, 'type="text" autocomplete="family-name"')}</div>
        <div class="pf locked"><label for="aE">${t('Email')}${LOCK}</label><input id="aE" type="email" value="${esc(user.email)}" disabled aria-describedby="acLk"></div>
        <div class="pl-two"><div class="pf${er.dob ? ' bad' : ''}" id="aDF"><label for="aD">${t('Date of birth')}</label><input id="aD" type="date" data-dob min="1900-01-01" max="${window.SFA_TODAY()}" value="${esc(f.dob)}"><p class="err">${t(er.dob || '')}</p></div>${genderField('aG', f.gender, er.gender)}</div>
        <div class="pf locked"><label for="aP">${t('Phone')}${LOCK}</label><input id="aP" type="tel" dir="ltr" value="${esc((user.phone || '').replace(/^\+966(\d{2})(\d{3})(\d{4})$/, '+966 $1 $2 $3'))}" placeholder="—" disabled aria-describedby="acLk"></div>
        <p class="meta lk-note" id="acLk">${LOCK}${t("Email and phone can't be changed here. Contact us to update them.")}</p>
        <p class="err pl-ferr"${er._ ? '' : ' hidden'}>${t(er._ || '')}</p>
        <div class="pl-acts"><button type="button" class="btn sm" data-asave>${t('Save changes')}</button><button type="button" class="ghost sm" data-acancel>${t('Cancel')}</button></div></div></section>`; }
    const dob = user.dob ? P.date(T.toDate(user.dob), { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
    return `<section class="acct" aria-labelledby="acH"><div class="sec"><h2 id="acH">${t('My profile')}</h2><button type="button" class="ghost sm" data-aedit>${t('Edit')}</button></div>
      <dl class="dl"><dt>${t('First name')}</dt><dd>${esc(user.first || '—')}</dd><dt>${t('Last name')}</dt><dd>${esc(user.last || '—')}</dd>
      <dt>${t('Email')}${LOCK}</dt><dd>${esc(user.email)}</dd><dt>${t('Date of birth')}</dt><dd>${dob}</dd>
      <dt>${t('Gender')}</dt><dd>${user.gender ? gname(user.gender) : '—'}</dd><dt>${t('Phone')}${LOCK}</dt><dd>${phoneTxt(user.phone)}</dd></dl>
      <p class="meta lk-note">${LOCK}${t("Email and phone can't be changed here. Contact us to update them.")}</p>
      <button type="button" class="ghost out" data-out>${t('Sign out')}</button></section>`;
  }

  function paint(){
    document.title = `${t('My account')} · SFA Domes`;
    if (!user){
      root.innerHTML = `<section class="in gate" style="padding-top:calc(var(--nav) + 64px)"><h1>${t('My account')}</h1><p class="meta">${t('Sign in to see your tickets and saved courts.')}</p><button type="button" class="btn" data-signin>${t('Sign in')}</button></section>`;
      return;
    }
    const cur = tab(), nUp = upItems(all()).length;
    const since = user.since ? t('Member since {date}', { date: P.date(new Date(user.since), 'month') }) : '';
    root.innerHTML = `<section class="pf-head"><div class="in"><div class="who"><span class="av" aria-hidden="true">${esc(initials(user))}</span>
        <p class="eye">${t('My account')}</p><h1>${esc(user.name)}</h1><p class="meta">${esc(user.email)}${since ? ' · ' + since : ''}</p></div>
        <div class="tabs" role="tablist" aria-label="${t('My account')}">${[['tickets', 'My tickets', nUp], ['people', 'My children', people.length], ['account', 'My profile']].map(([k, l, n]) =>
          `<button type="button" class="tab" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${k === cur}" data-tab="${k}">${t(l)}${n !== undefined ? `<b>${n}</b>` : ''}</button>`).join('')}</div></div></section>
      <section class="in panel" id="panel" role="tabpanel" aria-labelledby="tab-${cur}">${cur === 'tickets' ? tickets() : cur === 'people' ? children() : account()}</section>`;
    T.paintQR(root); A.paintFavs?.();
  }

  function openTicket(id){
    const x = all().find(y => y.s.id === id); if (!x) return;
    dlg.innerHTML = `<div class="dlg-top"><h2 id="dlgH">${t('Ticket')}</h2><button type="button" class="x" data-close aria-label="${t('Close')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="dlg-body">${T.ticket(x.s, x.b)}<div class="dlg-acts"><a class="ghost" href="${T.ics(x.b)}" download="${T.icsName(x.b)}">${CAL}${t('Add to calendar')}</a><a class="ghost" href="${T.DIRECTIONS}" target="_blank" rel="noopener">${PIN}${t('Get directions')}</a><a class="ghost" href="result.html?cart=${encodeURIComponent(x.b.cartId)}">${t('Booking details')}</a>${T.cancelInfo(x.b).can ? `<button type="button" class="ghost danger" data-cancel="${esc(x.b.cartId)}">${t('Cancel booking')}</button>` : ''}</div>${cancelLine(x.b)}</div>`;
    dlg.dir = document.documentElement.dir; dlg.showModal(); T.paintQR(dlg);
  }

  const v = id => (document.getElementById(id) || {}).value || '';
  // keep what's typed while the form re-renders
  const keepChild = () => pform && Object.assign(pform, { first: v('cF'), last: v('cL'), dob: v('cD') });
  const keepAcct = () => aform && Object.assign(aform, { first: v('aF'), last: v('aL'), dob: v('aD') });
  const firstBad = () => root.querySelector('.pf.bad input, .pf.bad button')?.focus();
  const post = async (url, body) => { try { const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); return { ok: r.ok, d: await r.json().catch(() => ({})) }; } catch (e) { return { ok: false, d: { error: 'Could not reach the server. Try again.' } }; } };
  root.addEventListener('click', async e => {
    const el = e.target.closest('[data-tab],[data-seg],[data-kind],[data-open],[data-out],[data-signin],[data-padd],[data-pedit],[data-pcancel],[data-psave],[data-gen],[data-rm],[data-rm-yes],[data-rm-no],[data-aedit],[data-acancel],[data-asave],[data-group],[data-back],[data-who],[data-renew],[data-cancel]'); if (!el) return;
    if (el.dataset.who){ who = el.dataset.who; paint(); root.querySelector(`[data-who="${CSS.escape(who)}"]`)?.focus(); return; }
    if (el.dataset.renew){ e.preventDefault(); e.stopPropagation(); return renew(el.dataset.renew); }
    if (el.dataset.cancel) return askCancel(el.dataset.cancel);
    if (el.dataset.group){ location.hash = '#tickets/' + encodeURIComponent(el.dataset.group); scrollTo({ top: 0 }); return; }
    if (el.hasAttribute('data-back')){ e.preventDefault(); location.hash = '#tickets'; return; }
    if (el.dataset.kind){ kind = el.dataset.kind; paint(); root.querySelector(`[data-kind="${kind}"]`)?.focus(); return; }
    // children
    if (el.hasAttribute('data-padd')){ removing = null; pform = { mode: 'add', first: '', last: '', dob: '', gender: '' }; paint(); document.getElementById('cF').focus(); return; }
    if (el.dataset.pedit){ const x = people.find(y => y.id === el.dataset.pedit); if (!x) return; removing = null;
      pform = { mode: 'edit', id: x.id, was: x.name, first: x.first || '', last: x.last || '', dob: x.dob, gender: x.gender }; paint(); document.getElementById('cF').focus(); return; }
    if (el.hasAttribute('data-pcancel')){ const id = pform && pform.id; pform = null; paint(); root.querySelector(id ? `[data-pedit="${id}"]` : '[data-padd]')?.focus(); return; }
    if (el.dataset.gen && el.closest('#cGF')){ keepChild(); pform.gender = el.dataset.gen; if (pform.errors) delete pform.errors.gender; paint(); root.querySelector(`#cGF [data-gen="${pform.gender}"]`).focus(); return; }
    if (el.hasAttribute('data-psave')){ keepChild();
      const c = { first: pform.first.trim(), last: pform.last.trim(), dob: pform.dob, gender: pform.gender }, errs = window.SFA_CHILD_ERRORS(c);
      if (Object.keys(errs).length){ pform.errors = errs; paint(); return firstBad(); }
      const edit = pform.mode === 'edit', r = await post('/api/auth/participants', edit ? { edit: pform.id, ...c } : { add: c });
      if (!r.ok){ pform.errors = r.d.errors || { _: r.d.error || 'Something went wrong. Try again.' }; paint(); return firstBad(); }
      const name = window.SFA_FULL_NAME(c), id = pform.id; people = r.d.participants; pform = null; paint(); ping();
      A.toast(t(edit ? '{name} updated' : '{name} added', { name })); root.querySelector(id ? `[data-pedit="${id}"]` : '[data-padd]')?.focus(); return; }
    if (el.dataset.rm){ pform = null; removing = el.dataset.rm; paint(); root.querySelector('[data-rm-no]')?.focus(); return; }
    if (el.hasAttribute('data-rm-no')){ const id = removing; removing = null; paint(); root.querySelector(`[data-rm="${id}"]`)?.focus(); return; }
    if (el.dataset.rmYes){ const x = people.find(y => y.id === el.dataset.rmYes), r = await post('/api/auth/participants', { remove: el.dataset.rmYes });
      if (r.ok){ people = r.d.participants; ping(); } removing = null; paint(); if (r.ok && x) A.toast(t('{name} removed', { name: x.name })); (root.querySelector('[data-padd]') || root.querySelector('#plH'))?.focus?.(); return; }
    // my profile
    if (el.hasAttribute('data-aedit')){ aform = { first: user.first || '', last: user.last || '', dob: user.dob || '', gender: user.gender || '' }; paint(); document.getElementById('aF').focus(); return; }
    if (el.hasAttribute('data-acancel')){ aform = null; paint(); root.querySelector('[data-aedit]')?.focus(); return; }
    if (el.dataset.gen && el.closest('#aGF')){ keepAcct(); aform.gender = el.dataset.gen; if (aform.errors) delete aform.errors.gender; paint(); root.querySelector(`#aGF [data-gen="${aform.gender}"]`).focus(); return; }
    if (el.hasAttribute('data-asave')){ keepAcct();
      const r = await post('/api/auth/profile', { first: aform.first, last: aform.last, dob: aform.dob, gender: aform.gender });
      if (!r.ok){ aform.errors = r.d.errors || { _: r.d.error || 'Something went wrong. Try again.' }; paint(); return firstBad(); }
      user = r.d.user; people = user.participants || people; aform = null; paint(); A.toast(t('Profile updated')); root.querySelector('[data-aedit]')?.focus(); return; }
    if (el.dataset.tab){ pform = null; aform = null; removing = null; history.replaceState(null, '', '#' + el.dataset.tab); paint(); document.getElementById('tab-' + el.dataset.tab)?.focus(); }
    else if (el.dataset.seg){ seg = el.dataset.seg; paint(); }
    else if (el.dataset.open) openTicket(el.dataset.open);
    else if (el.hasAttribute('data-out')) A.signOut();
    else if (el.hasAttribute('data-signin')) A.open({ view: 'login' });
  });
  // arrow keys move between tabs
  root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.pl-form input')){ e.preventDefault(); root.querySelector('[data-psave],[data-asave]')?.click(); } });
  root.addEventListener('input', e => { const f = e.target.closest('.pf'); if (f) f.classList.remove('bad'); });
  root.addEventListener('keydown', e => {
    const b = e.target.closest('.tab'); if (!b || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const i = TABS.indexOf(b.dataset.tab), dir = (e.key === 'ArrowRight') !== (document.documentElement.dir === 'rtl') ? 1 : -1;
    location.hash = TABS[(i + dir + TABS.length) % TABS.length];
  });
  // renew: checkout opens with the same program, time and participants, the next training day, 20% off
  function renew(id){
    const b = bookings.find(x => x.cartId === id), R = b && renewInfo(b); if (!R) return;
    const places = T.people(b).map(x => x.ref || (user && x.name === user.name ? 'me' : null)).filter(Boolean);
    try { sessionStorage.setItem('sfaOrder', JSON.stringify({ kind: 'program', program: b.order.program, plan: 'month', start: R.start, time: b.order.time, renew: b.cartId, people: { added: [], places }, kitSizes: [] })); } catch (e) {}
    location.href = 'checkout.html';
  }
  // cancel: confirm first (the whole booking, every ticket in it), then refund
  function askCancel(id){
    const b = bookings.find(x => x.cartId === id); if (!b) return;
    const D = T.describe(T.sessions(b)[0], b), n = T.sessions(b).length;
    dlg.innerHTML = `<div class="dlg-top"><h2 id="dlgH">${t('Cancel this booking?')}</h2><button type="button" class="x" data-close aria-label="${t('Close')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="dlg-body cx"><p><b>${esc(D.label)}</b> · <bdi>${esc(b.cartId)}</bdi></p>
        <p>${n > 1 ? t('All {n} tickets in this booking will be cancelled.', { n }) : t('Your ticket will be cancelled.')} ${b.amount ? t('{amount} goes back to your card within 5 to 10 working days.', { amount: P.money(b.amount) }) : ''} ${t('This can’t be undone.')}</p>
        <p class="err" id="cxErr" role="alert"></p>
        <div class="dlg-acts"><button type="button" class="btn sm danger" data-cx-yes="${esc(id)}">${b.amount ? t('Cancel and refund {amount}', { amount: P.money(b.amount) }) : t('Cancel booking')}</button><button type="button" class="ghost sm" data-close>${t('Keep booking')}</button></div></div>`;
    dlg.dir = document.documentElement.dir; if (!dlg.open) dlg.showModal(); dlg.querySelector('[data-close].ghost')?.focus();
  }
  dlg.addEventListener('click', async e => {
    if (e.target === dlg || e.target.closest('[data-close]')) return dlg.close();
    const c = e.target.closest('[data-cancel]'); if (c) return askCancel(c.dataset.cancel);
    const y = e.target.closest('[data-cx-yes]'); if (!y) return;
    y.disabled = true;
    const r = await post('/api/auth/cancel', { cart: y.dataset.cxYes });
    if (!r.ok){ y.disabled = false; dlg.querySelector('#cxErr').textContent = t(r.d.error || 'Something went wrong. Try again.'); return; }
    dlg.close();
    const b = await fetch('/api/auth/bookings').then(x => x.json()).catch(() => ({})); bookings = b.bookings || bookings;
    if (groupId()) history.replaceState(null, '', '#tickets');
    paint(); A.toast(r.d.refund ? t('Booking cancelled · {amount} refunded', { amount: `${t('SAR')} ${(+r.d.refund).toLocaleString('en-US')}` }) : t('Booking cancelled'));
  });
  addEventListener('hashchange', paint);
  addEventListener('sfa:prefs', paint);

  async function load(){
    user = await A.me();
    if (user){
      const [b, f] = await Promise.all([fetch('/api/auth/bookings').then(r => r.json()).catch(() => ({})), fetch('/api/auth/favorites').then(r => r.json()).catch(() => ({}))]);
      bookings = b.bookings || []; favs = f.favorites || []; people = user.participants || [];
    }
    paint();
  }
  addEventListener('sfa:auth', load);
  load();
})();
</script>
</body>
</html>
