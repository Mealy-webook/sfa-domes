<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courts · SFA Domes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=fitness_center,pickleball,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball&display=block">
<style>
/* Courts: the same layout and cards as Training programs (programs.html), Ahmed 2026-11-11. A text-only hero with the
   sport's name, a row of sport chips (each with its court count; the sport comes from ?sport= and stays in the URL), the
   court count on the right, then white cards: photo with tags, sport · court type, the court's name, its
   details and the price per hour. No "All sports" chip: every sport is its own set of courts on the same floor.
   Design-system tokens only (f/fonts.css text styles, f/colors.css); square corners. */
:root{color-scheme:light;--nav:90px;--g:clamp(16px,6.67vw,96px);--ease:cubic-bezier(.22,1,.36,1);--max:1440px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg-primary);color:var(--color-content-primary);font:var(--ts-body-default);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-brand);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
img{display:block}
@keyframes up{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
.hero{padding-top:var(--nav)}
.cap{width:100%;min-width:0;max-width:var(--max);margin:0 auto;padding:clamp(32px,7vh,72px) var(--g) 0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;animation:up 1s var(--ease) .1s both}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0;font:var(--ts-body-l-bold)}
.ico{display:grid;place-items:center;width:32px;height:32px;flex:none;background:var(--color-brand);color:var(--neutral-0)}
.ico .msi{font-size:var(--fs-20)}
.ico .mi{width:20px;height:20px}
.name{margin:0;font:var(--ts-display-l);text-transform:var(--type-case-display)}
.sub{margin:0;max-width:52ch;font:var(--ts-body-l);color:var(--color-content-secondary)}

.list{max-width:var(--max);margin:0 auto;padding:clamp(40px,7vh,72px) var(--g) clamp(56px,9vh,96px)}
.flt{display:grid;gap:16px;padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--color-border-secondary)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-4px;padding:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);font:var(--ts-body-default-bold);cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.chip:hover{border-color:var(--color-content-primary)}
.chip .msi{font-size:var(--fs-20)}
.mi{display:inline-block;width:20px;height:20px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.sp .mi{width:18px;height:18px;color:var(--color-brand)}
.chip small{font:var(--ts-caption-1-bold);color:var(--color-content-tertiary)}
.chip[aria-pressed=true]{background:var(--color-content-primary);border-color:var(--color-content-primary);color:var(--neutral-0)}
.chip[aria-pressed=true] small{color:inherit;opacity:.7}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.row2 h2{margin:0;font:var(--ts-title-section);text-transform:var(--type-case-title)}
.count{margin-inline-start:auto;font:var(--ts-body-default-bold);color:var(--color-content-tertiary)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--color-bg-primary);border:1px solid var(--color-border-primary);animation:up .7s var(--ease) both;animation-delay:calc(.05s * var(--i,0));transition:border-color .25s}
.tile:hover,.tile.picked{border-color:var(--color-content-primary)}
.tile.picked{box-shadow:inset 0 0 0 1px var(--color-content-primary)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--color-bg-tertiary)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.tile:hover .ph img{transform:scale(1.05)}
.tags{position:absolute;top:12px;inset-inline-start:12px;display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:4px 8px;background:var(--color-bg-primary);font:var(--ts-caption-1-bold)}
.tag.w{background:var(--color-programme-women);color:var(--neutral-0)}
.bd{display:grid;align-content:start;gap:8px;padding:20px}
.sp{display:flex;align-items:center;gap:8px;margin:0;font:var(--ts-caption-1-bold);color:var(--color-content-tertiary)}
.sp .msi{font-size:var(--fs-17);color:var(--color-brand)}
.nm{margin:0;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.meta{margin:0;font:var(--ts-body-s);color:var(--color-content-secondary)}
.pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:8px;padding-top:16px;border-top:1px solid var(--color-border-primary)}
.pr small{font:var(--ts-body-s);color:var(--color-content-secondary)}
.pr b{font:var(--ts-title-body)}
.pr em{margin-inline-start:auto;font:var(--ts-caption-1-bold);font-style:normal;color:var(--color-content-accent)}
.lnk{position:absolute;inset:0;z-index:1}
@media (max-width:1080px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div data-site-nav></div>
<main id="page"></main>
<div data-site-footer></div>

<script src="f/site-nav.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script>
(() => {
  const S = window.SFA_SPORTS, P = window.SFA_PREFS, t = P.t, L = window.SFA_LADIES;
  const params = new URLSearchParams(location.search);
  let key = S[params.get('sport')] ? params.get('sport') : 'basketball';
  const root = document.getElementById('page'), keys = Object.keys(S);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const icon = sp => sp.img ? `<span class="mi" style="--m:url(${sp.img})"></span>` : `<span class="msi">${sp.icon}</span>`;
  // the same photo on several courts gets a different framing on each (zoomed into another part), so cards don't look identical
  const CROPS = [['50% 50%', 1], ['12% 72%', 1.45], ['88% 62%', 1.45], ['50% 92%', 1.6], ['22% 30%', 1.5], ['78% 80%', 1.5]];
  const crop = i => `transform-origin:${CROPS[i % CROPS.length][0]};scale:${CROPS[i % CROPS.length][1]}`;
  const url = i => `court-details.html?sport=${encodeURIComponent(key)}&court=${i}`;
  const ladies = (k, i) => S[k].area === 'mp' && L && L.courts.includes(i);

  function paint(focus){
    const sport = S[key], courts = sport.courts, n = courts.length, name = esc(t(sport.name));
    document.title = `${t(sport.name)} · ${t('Courts')} · SFA Domes`;
    const sub = sport.area === 'field'
      ? t(key === 'rugby' ? 'Played on football fields F4 and F5 joined together.' : '5 indoor football fields: play 5-a-side, or book F4 and F5 together for 7-a-side.')
      : t('{n} indoor multipurpose courts. Pick one to book.', { n });
    root.innerHTML = `<section class="hero" aria-labelledby="sportName">
        <div class="cap"><p class="eyebrow"><span class="ico" aria-hidden="true">${icon(sport)}</span>${t('SFA Domes Dammam')}</p><h1 id="sportName" class="name">${name}</h1><p class="sub">${sub}</p></div></section>
      <section class="list" aria-labelledby="chooseH">
        <div class="flt"><div class="chips" role="group" aria-label="${t('Sport')}">${keys.map(k => `<button type="button" class="chip" data-sport="${k}" aria-pressed="${k === key}"><span aria-hidden="true">${icon(S[k])}</span>${esc(t(S[k].name))}<small>${S[k].courts.length}</small></button>`).join('')}</div>
          <div class="row2"><h2 id="chooseH">${t('Choose a court')}</h2><span class="count" aria-live="polite">${n === 1 ? t('1 court') : t('{n} courts', { n })}</span></div></div>
        <div class="grid">${courts.map((c, i) => `<article class="tile" style="--i:${focus ? 0 : i}">
          <div class="ph"><img src="${window.SFA_COURT_IMG(key, c)}" alt="" loading="lazy" style="${crop(i)}"><div class="tags">${c[3] ? `<span class="tag">${esc(t(c[3]))}</span>` : ''}${ladies(key, i) ? `<span class="tag w">${t('Ladies hours')}</span>` : ''}</div></div>
          <div class="bd"><p class="sp"><span aria-hidden="true">${icon(sport)}</span>${name} · ${esc(t(c[1]))}</p><h3 class="nm"><a class="lnk" href="${url(i)}" data-i="${i}" aria-label="${t('View court')}: ${esc(t(c[0]))}"></a>${esc(t(c[0]))}</h3>
            <p class="meta">${[t('Indoor'), c[2], c[4]].filter(Boolean).map(v => esc(t(v))).join(' · ')}</p>
            <p class="pr"><small>${t('From')}</small><b>${P.money(c[5])}</b><small>${t('/ hr')}</small><em>${t('90-minute slots')}</em></p></div></article>`).join('')}</div></section>`;
    // back from the details page: the court you opened stays marked
    const pre = root.querySelector(`.lnk[data-i="${params.get('court')}"]`);
    if (params.has('court') && pre && params.get('sport') === key) pre.closest('.tile').classList.add('picked');
    shrink();
    if (focus) root.querySelector(focus)?.focus({ preventScroll: true });
  }
  // a long sport name (Basketball, Table Tennis) shrinks until it fits the width, so it never spills off a phone
  const shrink = () => { const h = root.querySelector('.name'); if (!h) return; h.style.fontSize = ''; const k = h.clientWidth / h.scrollWidth; if (k < 1) h.style.fontSize = parseFloat(getComputedStyle(h).fontSize) * k * .98 + 'px'; };
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-sport]');
    if (b){ key = b.dataset.sport; params.delete('court'); history.replaceState(null, '', `?sport=${encodeURIComponent(key)}`); paint(`[data-sport="${key}"]`); return; }
    // remember which court was opened, so Back lands on this page with it marked
    const a = e.target.closest('.lnk'); if (a) history.replaceState(null, '', `?sport=${encodeURIComponent(key)}&court=${a.dataset.i}`);
  });
  paint();
  addEventListener('sfa:prefs', () => paint());
  addEventListener('resize', shrink); document.fonts?.ready.then(shrink);
})();
</script>
</body>
</html>
