<!doctype html>
<html lang="en">
<head>
<script src="f/demo-seed.js"></script><script src="f/demo-api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About us · SFA Domes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="f/fonts.css">
<link rel="stylesheet" href="f/colors.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..700,0,0&icon_names=apartment,arrow_forward,call,directions,exercise,groups,local_parking,location_on,open_in_new,schedule,sports,sports_basketball,sports_handball,sports_rugby,sports_soccer,sports_tennis,sports_volleyball,stadium,woman&display=block">
<style>
/* About us (Ahmed, 2026-11-19: "create design for about page"). Facts from the live site (sfadomes.com/en/about and the
   Dammam page): a year-round indoor multi-sport venue for the Eastern Province, the live sports and courts
   (f/courts-data.js), a clubhouse for school visits up to events of 1,000 people, male and female washrooms and showers,
   250 parking spots, Dammam 32265, +966 555129139, part of the Saudi Sports for All Federation.
   Sections: hero with the dome photo · numbers · every sport (the home page's icon grid, on white) · the venue ·
   a court for everyone (the four services) · visit us (address, phone, hours, directions) · the federation band.
   Design-system tokens (f/fonts.css, f/colors.css), square corners, 4/8 spacing, mirrored in Arabic. */
:root{color-scheme:light;--nav:90px;--g:clamp(16px,6.67vw,96px);--ease:cubic-bezier(.22,1,.36,1);--max:1440px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg-primary);color:var(--color-content-primary);font:var(--ts-body-default);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--color-brand);outline-offset:3px}
img{display:block;max-width:100%}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.mi{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
[dir=rtl] .fl{scale:-1 1}
@keyframes up{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
.in{max-width:var(--max);margin:0 auto;padding-inline:var(--g)}

/* hero: eyebrow, title and the lead beside each other, then the dome photo full width */
.hero{padding-top:var(--nav)}
.hero .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px clamp(32px,5vw,80px);align-items:end;padding-block:clamp(32px,7vh,72px) clamp(32px,5vh,56px);animation:up 1s var(--ease) .1s both}
.eyebrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:0;font:var(--ts-body-l-bold)}
.ico{display:grid;place-items:center;width:32px;height:32px;flex:none;background:var(--color-brand);color:var(--neutral-0)}
.ico .msi{font-size:var(--fs-20)}
h1{margin:0;font:var(--ts-display-l);text-transform:var(--type-case-display)}
.lead{margin:0;font:var(--ts-body-l);color:var(--color-content-secondary)}
.lead b{color:var(--color-content-primary)}
.pic{position:relative;max-width:var(--max);margin:0 auto;padding-inline:var(--g)}
.pic img{width:100%;aspect-ratio:21/9;object-fit:cover;animation:up 1.1s var(--ease) .25s both}
.pic figcaption{position:absolute;inset-inline-start:calc(var(--g) + 16px);bottom:16px;padding:8px 12px;background:var(--neutral-950);color:var(--neutral-0);font:var(--ts-body-s-bold)}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;padding:0;list-style:none;border-bottom:1px solid var(--color-border-primary)}
.nums li{display:grid;gap:8px;align-content:start;padding:32px 24px;border-inline-end:1px solid var(--color-border-primary)}
.nums li:last-child{border-inline-end:0}
.nums small{font:var(--ts-caption-1-bold);text-transform:var(--type-case-label);color:var(--color-content-tertiary)}
.nums b{font:var(--ts-display-s);color:var(--color-content-accent)}
.nums span{font:var(--ts-body-s);color:var(--color-content-secondary)}

/* sections */
.sec{padding-block:clamp(56px,10vh,112px)}
.sec + .sec{padding-top:0}
.sec > .in > .head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:32px}
.sec > .in > .head h2{margin:0;font:var(--ts-display-s);text-transform:var(--type-case-display)}
.sec > .in > .head p{margin:0;max-width:52ch;font:var(--ts-body-l);color:var(--color-content-secondary)}

/* every sport: the home page's icon grid (option H), dark text on white */
.sg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0;padding:0;list-style:none;border-top:1px solid var(--color-border-primary);border-inline-start:1px solid var(--color-border-primary)}
.sg li{border-bottom:1px solid var(--color-border-primary);border-inline-end:1px solid var(--color-border-primary)}
.sg a{position:relative;display:grid;align-content:space-between;gap:32px;height:100%;min-height:180px;padding:24px;text-decoration:none;transition:background-color .25s,color .25s}
.sg .ic{display:grid;place-items:center;width:56px;height:56px;border:1px solid var(--color-border-secondary);font-size:var(--fs-28);transition:background-color .25s,border-color .25s,color .25s}
.sg .ic .msi{font-size:var(--fs-28)}
.sg b{display:block;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.sg small{display:block;margin-top:4px;font:var(--ts-caption-1-bold);text-transform:var(--type-case-label);color:var(--color-content-tertiary);transition:color .25s}
.sg .go{position:absolute;top:24px;inset-inline-end:24px;font-size:var(--fs-24);opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .35s var(--ease)}
.sg a:hover,.sg a:focus-visible{background:var(--neutral-950);color:var(--neutral-0)}
.sg a:hover small,.sg a:focus-visible small{color:var(--neutral-400)}
.sg a:hover .ic,.sg a:focus-visible .ic{background:var(--color-brand);border-color:var(--color-brand);color:var(--neutral-0)}
.sg a:hover .go,.sg a:focus-visible .go{opacity:1;transform:none}
[dir=rtl] .sg .go{scale:-1 1;transform:translateX(8px)}

/* the venue: photo and text, the second row mirrored */
.vn{display:grid;gap:clamp(40px,7vh,80px)}
.vr{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center}
.vr:nth-child(even) .vp{order:2}
.vp{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--color-bg-secondary)}
.vp img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.vr:hover .vp img{transform:scale(1.04)}
.vt{display:grid;gap:16px;justify-items:start}
.vt .tag{padding:4px 8px;background:var(--color-bg-accent-tag);color:var(--color-content-accent);font:var(--ts-caption-1-bold);text-transform:var(--type-case-label)}
.vt h3{margin:0;font:var(--ts-title-section);text-transform:var(--type-case-title)}
.vt p{margin:0;font:var(--ts-body-l);color:var(--color-content-secondary)}
.vt ul{display:grid;gap:12px;margin:8px 0 0;padding:0;list-style:none;width:100%}
.vt li{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--color-border-primary);font:var(--ts-body-default-bold)}
.vt li .msi{font-size:var(--fs-24);color:var(--color-content-accent)}

/* a court for everyone: the four services */
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.svc a{display:grid;grid-template-rows:auto 1fr auto;gap:16px;height:100%;padding:24px;background:var(--color-bg-secondary);text-decoration:none;transition:background-color .25s,color .25s}
.svc .msi{font-size:var(--fs-32);color:var(--color-content-accent);transition:color .25s}
.svc b{display:block;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.svc p{margin:8px 0 0;font:var(--ts-body-s);color:var(--color-content-secondary);transition:color .25s}
.svc .more{display:inline-flex;align-items:center;gap:8px;font:var(--ts-body-s-bold)}
.svc .more .msi{font-size:var(--fs-20);color:inherit;transition:transform .3s var(--ease)}
.svc a:hover,.svc a:focus-visible{background:var(--color-brand);color:var(--neutral-0)}
.svc a:hover .msi,.svc a:focus-visible .msi,.svc a:hover p,.svc a:focus-visible p{color:var(--neutral-0)}
.svc a:hover .more .msi{transform:translateX(4px)}
[dir=rtl] .svc a:hover .more .msi{transform:translateX(-4px)}

/* visit us */
.vis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--color-border-primary)}
.vis > div{padding:clamp(24px,3vw,40px)}
.vis > div + div{border-inline-start:1px solid var(--color-border-primary)}
.vis h3{margin:0 0 16px;font:var(--ts-title-body);text-transform:var(--type-case-title)}
.vis dl{display:grid;gap:16px;margin:0}
.vis dl div{display:flex;gap:12px}
.vis dt .msi{font-size:var(--fs-24);color:var(--color-content-accent)}
.vis dd{margin:0;display:grid;gap:2px}
.vis dd small{font:var(--ts-caption-1-bold);text-transform:var(--type-case-label);color:var(--color-content-tertiary)}
.vis dd span,.vis dd a{font:var(--ts-body-l-bold);text-decoration:none}
.vis dd a:hover{color:var(--color-content-accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 20px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);font:var(--ts-body-default-bold);text-decoration:none;transition:border-color .2s,filter .2s}
.btn .msi{font-size:var(--fs-20)}
.btn:hover{border-color:var(--color-content-primary)}
.btn.pri{border-color:var(--color-brand);background:var(--color-brand);color:var(--neutral-0)}
.btn.pri:hover{filter:brightness(.92)}
.hrs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin:0}
.hrs dt,.hrs dd{margin:0;padding:12px 0;border-bottom:1px solid var(--color-border-primary);font:var(--ts-body-default)}
.hrs dd{text-align:end;font-weight:600}
.hrs .today{color:var(--color-content-accent);font-weight:600}

/* the federation band */
.fed{background:var(--neutral-950);color:var(--neutral-0)}
.fed .in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:clamp(40px,7vh,72px)}
.fed small{display:block;margin-bottom:8px;font:var(--ts-caption-1-bold);text-transform:var(--type-case-label);color:var(--neutral-400)}
.fed b{display:block;max-width:28ch;font:var(--ts-title-section);text-transform:var(--type-case-title)}
.fed .btn{border-color:rgba(255,255,255,.4);background:none;color:var(--neutral-0);flex:none}
.fed .btn:hover{border-color:var(--neutral-0)}

@media (max-width:1100px){
  .sg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sg a{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;align-content:center;gap:16px;min-height:0;padding:16px 20px}
  .sg .go{position:static;opacity:1;transform:none}
  .svc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums li:nth-child(2){border-inline-end:0}
  .nums li:nth-child(-n+2){border-bottom:1px solid var(--color-border-primary)}
}
@media (max-width:820px){
  .hero .in{grid-template-columns:minmax(0,1fr)}
  .pic{padding-inline:0}
  .pic img{aspect-ratio:4/3}
  .pic figcaption{inset-inline-start:16px}
  .vr{grid-template-columns:minmax(0,1fr);gap:24px}
  .vr:nth-child(even) .vp{order:0}
  .vis{grid-template-columns:minmax(0,1fr)}
  .vis > div + div{border-inline-start:0;border-top:1px solid var(--color-border-primary)}
  .fed .in{flex-direction:column;align-items:flex-start}
  .sec > .in > .head{flex-direction:column;align-items:flex-start;gap:12px}
}
@media (max-width:639px){
  h1{font:var(--ts-display-s)}
  .sg{grid-template-columns:minmax(0,1fr)}
  .sg .ic{width:48px;height:48px}
  .svc{grid-template-columns:minmax(0,1fr)}
  .nums li{padding:24px 16px}
  .nums b{font:var(--ts-title-section)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="f/ui.css">
</head>
<body>
<div data-site-nav></div>
<main id="page"></main>
<div data-site-footer></div>
<script src="f/site-nav.js"></script><script src="f/city.js"></script>
<script src="f/site-footer.js"></script>
<script src="f/courts-data.js"></script>
<script src="f/i18n-ar.js"></script>
<script src="f/prefs.js"></script>
<script src="f/auth.js"></script>
<script>
(() => {
  const P = window.SFA_PREFS, t = P.t, S = window.SFA_SPORTS, root = document.getElementById('page');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const PHONE = '+966 555129139', DIRECTIONS = 'https://www.google.com/maps/dir/?api=1&destination=26.4047835,50.0250094';
  const ARROW = '<span class="msi fl" aria-hidden="true">arrow_forward</span>';
  const icon = sp => sp.img ? `<span class="mi" style="--m:url(${sp.img})"></span>` : `<span class="msi">${sp.icon}</span>`;
  const courts = n => n === 1 ? t('1 court') : t('{n} courts', { n });
  const KEYS = window.SFA_TOP_SPORTS(Object.keys(S));
  const total = KEYS.reduce((a, k) => a + S[k].courts.length, 0);
  const num = n => n.toLocaleString(P.lang === 'ar' ? 'ar-SA-u-nu-latn' : 'en-US');
  // opening hours per weekday (f/courts-data.js SFA_SCHEDULE); a close past midnight reads as the next morning
  function hours(){
    const H = window.SFA_SCHEDULE.HOURS, today = new Date().getDay();
    return [0, 1, 2, 3, 4, 5, 6].map(d => `<dt${d === today ? ' class="today"' : ''}>${new Date(2026, 0, 4 + d).toLocaleDateString(P.locale, { weekday: 'long' })}${d === today ? ` · ${t('Today')}` : ''}</dt>
      <dd${d === today ? ' class="today"' : ''}><bdi>${P.time(H[d][0])} – ${P.time(H[d][1])}</bdi></dd>`).join('');
  }
  function paint(){
    document.title = `${t('About us')} · SFA Domes`;
    root.innerHTML = `
    <section class="hero" aria-labelledby="h1"><div class="in">
      <p class="eyebrow"><span class="ico" aria-hidden="true"><span class="msi">stadium</span></span>${t('SFA Domes Dammam')}</p>
      <h1 id="h1">${t('A court for everyone')}</h1>
      <p class="lead">${t('SFA Domes give everyone in the Eastern Province a year-round, indoor home for sport. <b>{s} sports and {c} courts under one roof</b>, open to the whole community, so everyone gets the chance to move.', { s: KEYS.length, c: total })}</p>
    </div>
    <figure class="pic" style="margin:0 auto"><img src="f/courts/other.jpg" alt="${t('Inside the dome: an indoor multipurpose court')}"><figcaption>${t('Dammam · open all year')}</figcaption></figure></section>

    <section class="sec" aria-label="${t('SFA Domes in numbers')}" style="padding-bottom:0"><div class="in">
      <ul class="nums">
        <li><small>${t('Sports')}</small><b>${num(KEYS.length)}</b><span>${t('Nearly every team sport')}</span></li>
        <li><small>${t('Courts')}</small><b>${num(total)}</b><span>${t('Indoor, all year round')}</span></li>
        <li><small>${t('Clubhouse')}</small><b>${num(1000)}</b><span>${t('People at a single event')}</span></li>
        <li><small>${t('Parking')}</small><b>${num(250)}</b><span>${t('Spots at the dome')}</span></li>
      </ul></div></section>

    <section class="sec" aria-labelledby="spH"><div class="in">
      <div class="head"><h2 id="spH">${t('Every team sport under one roof')}</h2><p>${t('Pick a sport to see its courts and book a 1.5-hour session.')}</p></div>
      <ul class="sg">${KEYS.map(k => `<li><a href="courts.html?sport=${k}"><span class="ic" aria-hidden="true">${icon(S[k])}</span><span><b>${esc(t(S[k].name))}</b><small>${courts(S[k].courts.length)}</small></span><span class="msi go" aria-hidden="true">arrow_forward</span></a></li>`).join('')}</ul>
    </div></section>

    <section class="sec" aria-labelledby="vnH"><div class="in">
      <div class="head"><h2 id="vnH">${t('The venue')}</h2></div>
      <div class="vn">
        <div class="vr"><div class="vp"><img src="f/courts/football.jpg" alt="" loading="lazy"></div>
          <div class="vt"><span class="tag">${t('Courts')}</span><h3>${t('Multipurpose courts and football courts')}</h3>
            <p>${t('The most complete sports courts in the Eastern region, with high-quality equipment and surfaces. Everything is indoors, so the conditions are right in every season.')}</p>
            <ul><li><span class="msi" aria-hidden="true">sports</span>${t('Multipurpose courts for {n} sports', { n: KEYS.filter(k => S[k].area === 'mp').length })}</li>
              <li><span class="msi" aria-hidden="true">sports_soccer</span>${t('5-a-side and 7-a-side football courts')}</li>
              <li><span class="msi" aria-hidden="true">sports_tennis</span>${t('{n} padel courts', { n: (S.padel || { courts: [] }).courts.length })}</li></ul></div></div>
        <div class="vr"><div class="vp"><img src="f/courts/basketball.jpg" alt="" loading="lazy"></div>
          <div class="vt"><span class="tag">${t('Clubhouse')}</span><h3>${t('The clubhouse')}</h3>
            <p>${t('The clubhouse takes everything from a school visit to large events with 1,000 people.')}</p>
            <ul><li><span class="msi" aria-hidden="true">apartment</span>${t('Washrooms and showers for men and women')}</li>
              <li><span class="msi" aria-hidden="true">groups</span>${t('School visits, team days and large events')}</li>
              <li><span class="msi" aria-hidden="true">local_parking</span>${t('{n} parking spots', { n: 250 })}</li></ul></div></div>
      </div>
    </div></section>

    <section class="sec" aria-labelledby="svH"><div class="in">
      <div class="head"><h2 id="svH">${t('Ways to play')}</h2></div>
      <ul class="svc">
        <li><a href="courts.html"><span class="msi" aria-hidden="true">stadium</span><span><b>${t('Courts')}</b><p>${t('Book courts for all sports and come play with your friends.')}</p></span><span class="more">${t('Book a court')}${ARROW}</span></a></li>
        <li><a href="programs.html"><span class="msi" aria-hidden="true">exercise</span><span><b>${t('Training programs')}</b><p>${t('Training sessions designed to help you reach your goals.')}</p></span><span class="more">${t('See programs')}${ARROW}</span></a></li>
        <li><a href="ladies-hours.html"><span class="msi" aria-hidden="true">woman</span><span><b>${t('Ladies hours')}</b><p>${t('Women-only sessions on the courts: one ticket gets you in.')}</p></span><span class="more">${t('See sessions')}${ARROW}</span></a></li>
        <li><a href="matches.html"><span class="msi" aria-hidden="true">groups</span><span><b>${t('Open games')}</b><p>${t('Join a game we run: turn up, play with others and pay for your own spot.')}</p></span><span class="more">${t('Find a game')}${ARROW}</span></a></li>
      </ul>
    </div></section>

    <section class="sec" aria-labelledby="viH"><div class="in">
      <div class="head"><h2 id="viH">${t('Visit us')}</h2></div>
      <div class="vis">
        <div><h3>${t('SFA Domes Dammam')}</h3>
          <dl><div><dt><span class="msi" aria-hidden="true">location_on</span></dt><dd><small>${t('Address')}</small><span>${t('Dammam 32265, Saudi Arabia')}</span></dd></div>
            <div><dt><span class="msi" aria-hidden="true">call</span></dt><dd><small>${t('Phone')}</small><a href="tel:${PHONE.replace(/\s/g, '')}" dir="ltr">${PHONE}</a></dd></div></dl>
          <div class="acts"><a class="btn pri" href="${DIRECTIONS}" target="_blank" rel="noopener noreferrer"><span class="msi" aria-hidden="true">directions</span>${t('Get directions')}</a>
            <a class="btn" href="tel:${PHONE.replace(/\s/g, '')}"><span class="msi" aria-hidden="true">call</span>${t('Call us')}</a></div></div>
        <div><h3>${t('Opening hours')}</h3><dl class="hrs">${hours()}</dl></div>
      </div>
    </div></section>

    <section class="fed" aria-label="${t('Saudi Sports for All Federation')}"><div class="in">
      <div><small>${t('Part of')}</small><b>${t('The Saudi Sports for All Federation')}</b></div>
      <a class="btn" href="https://sportsforall.com.sa/" target="_blank" rel="noopener noreferrer">${t('Visit sportsforall.com.sa')}<span class="msi" aria-hidden="true">open_in_new</span></a>
    </div></section>`;
  }
  paint();
  addEventListener('sfa:prefs', paint);
})();
</script>
</body>
</html>
