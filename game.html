<style>
/* One open game (game.html?id=<sport|court|date|start>), on the same layout as court and program details (f/kl.css,
   Ahmed 2026-11-11: same look and feel everywhere): breadcrumb, photo, the eyebrow, title, badges and facts, then the
   booking section "Join this game" (who's playing — you for adult games, one of your children 6–17 for kids' games —
   the summary, the terms and Join), How it works and Location; a price card beside it on desktop and the bottom bar on
   phones. Each person's first open game is free; server.js re-checks everything. DS tokens only; square corners. */
.mi{display:inline-block;width:20px;height:20px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.gm-photo{position:relative;height:clamp(280px,32vw,460px);margin:0 0 28px;overflow:hidden;background:var(--color-bg-tertiary)}
.gm-photo img{width:100%;height:100%;object-fit:cover}
.kl-badges li.kids{background:var(--color-programme-youth,var(--color-brand));color:var(--neutral-0)}
.kl-badges li.free{background:var(--color-bg-accent-subtle);color:var(--color-content-accent)}
.spots{display:grid;gap:8px;margin-top:24px;padding:16px 20px;border:1px solid var(--color-border-primary);background:var(--color-bg-primary)}
.spots-t{display:flex;justify-content:space-between;gap:8px;font:var(--ts-body-default-bold)}
.spots-t small{font:var(--ts-body-s);color:var(--color-content-secondary)}
.bar{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.bar i{height:8px;background:var(--color-bg-tertiary)}
.bar i.on{background:var(--color-content-primary)}
/* the booking section */
.jn{display:grid;gap:20px;padding:24px;border:1px solid var(--color-border-primary);background:var(--color-bg-primary)}
.pl{display:grid;gap:8px}
.pl > span{font:var(--ts-body-default-bold);color:var(--color-content-secondary)}
.opt{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);text-align:start;font:inherit;color:inherit;cursor:pointer}
.opt:hover{border-color:var(--color-content-primary)}
.opt[aria-checked=true]{border:2px solid var(--color-brand);padding:15px 17px;background:var(--color-bg-accent-subtle)}
.opt:disabled{cursor:not-allowed;background:var(--color-bg-secondary);border-color:var(--color-border-primary)}
.opt .dot{width:20px;height:20px;border:2px solid var(--color-border-strong);border-radius:50%}
.opt[aria-checked=true] .dot{border:6px solid var(--color-brand)}
.opt b{display:block;font:var(--ts-body-l-bold)}
.opt small{display:block;font:var(--ts-body-s);color:var(--color-content-secondary)}
.opt:disabled b{opacity:.5}
.opt:disabled small{color:var(--color-danger)}
.opt em{font:var(--ts-caption-1-bold);font-style:normal;color:var(--color-content-accent)}
/* several players (Ahmed, 2026-11-17): each row is a tick box; guests (adult games) are added by full name + Saudi mobile */
.opt .box{display:grid;place-items:center;width:20px;height:20px;border:2px solid var(--color-border-strong);background:var(--color-bg-primary)}
.opt .box svg{width:14px;height:14px;opacity:0}
.opt[aria-checked=true] .box{border-color:var(--color-brand);background:var(--color-brand)}
.opt[aria-checked=true] .box svg{opacity:1}
.pl-hint{margin:0;font:var(--ts-body-s);color:var(--color-content-secondary)}
.gst{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:15px 17px;border:2px solid var(--color-brand);background:var(--color-bg-accent-subtle)}
.gst .box{display:grid;place-items:center;width:20px;height:20px;background:var(--color-brand)}
.gst .box svg{width:14px;height:14px}
.gst b{display:block;font:var(--ts-body-l-bold)}
.gst small{display:block;font:var(--ts-body-s);color:var(--color-content-secondary)}
.gst em{font:var(--ts-caption-1-bold);font-style:normal;color:var(--color-content-accent)}
.gst-x{display:grid;place-items:center;width:32px;height:32px;margin:-6px -8px;padding:0;border:0;background:none;color:var(--color-content-primary);cursor:pointer}
.gst-x svg{width:16px;height:16px}
.gst-x:hover{color:var(--color-danger)}
.add-g{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:1px dashed var(--color-border-strong);background:var(--color-bg-primary);font:var(--ts-body-default-bold);color:var(--color-content-primary);cursor:pointer}
.add-g:hover{border-color:var(--color-content-primary)}
.add-g:disabled{cursor:not-allowed;color:var(--color-content-disabled)}
.add-g svg{width:18px;height:18px}
.gf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;padding:16px;border:1px solid var(--color-border-secondary)}
.gf .full{grid-column:1/-1}
.gf label{display:block;margin-bottom:8px;font:var(--ts-body-default-bold);color:var(--color-content-secondary)}
.gf .in{display:flex;align-items:center;height:48px;border:1px solid var(--color-border-strong);background:var(--color-bg-primary)}
.gf .in:focus-within{border-color:var(--color-content-primary);box-shadow:inset 0 0 0 1px var(--color-content-primary)}
.gf .in input{flex:1;min-width:0;height:100%;padding:0 14px;border:0;background:transparent;outline:0;font:var(--ts-body-default);color:inherit}
.gf .in .pre{display:grid;place-items:center;height:100%;padding:0 12px;border-inline-end:1px solid var(--color-border-primary);background:var(--color-bg-secondary);font:var(--ts-body-default);color:var(--color-content-secondary)}
.gf .bad .in{border-color:var(--color-danger);box-shadow:inset 0 0 0 1px var(--color-danger)}
.gf .e{display:none;margin:6px 0 0;font:var(--ts-body-s);color:var(--color-danger)}
.gf .bad .e{display:block}
.gf-acts{display:flex;gap:8px}
.gf-acts button{height:44px;padding:0 20px;border:1px solid var(--color-border-strong);background:var(--color-bg-primary);font:var(--ts-body-default-bold);color:var(--color-content-primary);cursor:pointer}
.gf-acts .ok{border-color:var(--color-brand);background:var(--color-brand);color:var(--color-content-on-accent)}
.rows .lines{display:grid;gap:6px}
.rows .lines span{display:flex;justify-content:space-between;gap:12px}
.rows .lines s{margin-inline-end:6px;color:var(--color-content-secondary)}
@media (max-width:639px){.gf{grid-template-columns:minmax(0,1fr)}}
.rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font:var(--ts-body-s)}
.rows dt{color:var(--color-content-tertiary)}
.rows dd{margin:0;text-align:end;overflow-wrap:anywhere}
.rows .sep{grid-column:1/-1;height:1px;margin-top:4px;background:var(--color-border-primary)}
.rows .total{padding-top:4px;font:var(--ts-body-l-bold)}
.rows dd.total{font:var(--ts-title-body)}
.rows s{color:var(--color-content-tertiary);margin-inline-end:8px}
.note{margin:0;padding:12px 16px;background:var(--color-bg-secondary);font:var(--ts-body-s);color:var(--color-content-secondary)}
.note.bad{border-inline-start:4px solid var(--color-danger)}
.terms{position:relative;display:flex;align-items:flex-start;gap:12px;font:var(--ts-body-s);cursor:pointer}
.terms input{position:absolute;opacity:0}
.terms .box{display:grid;place-items:center;flex:none;width:22px;height:22px;border:1.5px solid var(--color-border-secondary)}
.terms .box svg{width:14px;height:14px;opacity:0}
.terms input:checked + .box{background:var(--color-brand);border-color:var(--color-brand)}
.terms input:checked + .box svg{opacity:1}
.terms input:focus-visible + .box{outline:2px solid var(--color-brand);outline-offset:2px}
.terms.bad .box{border-color:var(--color-danger)}
.err{margin:0;font:var(--ts-body-s);color:var(--color-danger)}
.err:empty{display:none}
.jn .book svg,.go .book svg{flex:none;width:20px;height:20px}
[dir=rtl] .jn .book svg,[dir=rtl] .go .book svg{scale:-1 1}
.go .book{white-space:nowrap}
.jn .book:disabled{background:var(--color-bg-tertiary);color:var(--color-content-disabled);cursor:not-allowed}
.jn .book.ghost{background:var(--color-bg-primary);border:1px solid var(--color-border-secondary);color:var(--color-content-primary);text-decoration:none}
.how{list-style:none;margin:0;padding:0;display:grid;gap:0}
.how li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--color-border-primary);font:var(--ts-body-default);color:var(--color-content-secondary);counter-increment:h}
.how{counter-reset:h}
.how li::before{content:counter(h);display:grid;place-items:center;width:32px;height:32px;background:var(--color-content-primary);color:var(--neutral-0);font:var(--ts-body-default-bold)}
.how b{display:block;color:var(--color-content-primary);font:var(--ts-body-l-bold)}
.gm-empty{display:grid;justify-items:start;gap:16px;padding:40px;border:1px dashed var(--color-border-secondary);background:var(--color-bg-primary)}
.gm-empty p{margin:0;font:var(--ts-body-l);color:var(--color-content-secondary)}
@media (max-width:1023px){.gm-photo{height:auto;aspect-ratio:4/3;margin-inline:calc(var(--g,16px) * -1)}.jn{padding:20px}}
</style>

<script>
(() => {
  const P = window.SFA_PREFS, t = P.t, S = window.SFA_SPORTS, SLOT = window.SFA_SCHEDULE.SLOT, WHO = window.SFA_GAME_WHO;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const root = document.getElementById('page'), id = new URLSearchParams(location.search).get('id') || '';
  const toDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const icon = sp => sp.img ? `<span class="mi" style="--m:url(${sp.img})"></span>` : `<span class="msi">${sp.icon}</span>`;
  const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true">${p}</svg>`;
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="square" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14m-6-7 7 7-7 7"/></svg>';
  const I = {
    cal: SV('<path d="M4 6h16v14H4zM4 10h16M8 3v4m8-4v4"/>'), pin: SV('<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><path d="M12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>'),
    who: SV('<path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.3a3.5 3.5 0 0 1 0 6.6M18 13.5a6.5 6.5 0 0 1 3.5 6.5"/>'), fmt: SV('<path d="M3 5h18v14H3zM12 5v14"/><path d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/>')
  };
  let me = null, mine = [], online = {}, picks = [], guests = [], gForm = null, quote = null, qSeq = 0, agreed = false, busy = false, err = '';
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  const fmtPhone = d => [d.slice(0, 2), d.slice(2, 5), d.slice(5)].filter(Boolean).join(' ');
  const g = window.SFA_GAME(id);
  // who already holds a spot, and who has had a game before (the first is free), from the account's bookings
  const keysOf = b => ((b.order.participants && b.order.participants.filter(x => !x.cancelled)) || [b.order.bookingFor && b.order.bookingFor.type === 'child' ? { type: 'child', ref: b.order.bookingFor.ref, name: b.order.bookingFor.name } : { type: 'me' }])
    .map(x => x.type === 'guest' ? 'tel:' + x.phone : x.type === 'child' ? 'child:' + (x.ref || x.name) : 'me');
  const inGame = k => mine.some(b => b.order.kind === 'game' && b.order.game === id && b.status === 'paid' && keysOf(b).includes(k));
  const hadGame = k => mine.some(b => b.order.kind === 'game' && b.status === 'paid' && keysOf(b).includes(k));
  const taken = () => g.base + ((online[g.id] || {}).taken || 0);
  const started = () => { const n = new Date(), k = window.SFA_TODAY(n); return g.date < k || (g.date === k && g.start <= n.getHours() * 60 + n.getMinutes()); };
  // the people on the account who could take a spot: you (adult games) or each child (kids' games)
  function people(){
    if (!me) return [];
    const you = { key: 'me', ref: 'me', name: me.name, dob: me.dob, you: true };
    const kids = (me.participants || []).map(c => ({ key: 'child:' + c.id, ref: c.id, name: c.name, dob: c.dob }));
    return (g.who === 'kids' ? kids : [you]).map(x => {
      const age = x.dob ? window.SFA_AGE(x.dob, g.date) : null;
      const why = inGame(x.key) ? t('Already in this game') : x.you && !x.dob ? t('Add your date of birth in My account') : window.SFA_GAME_FITS(g, x) ? (g.who === 'kids' ? t('Must be 6 to 17 on the day') : t('Adults (18+) only')) : '';
      return { ...x, age, why, free: !hadGame(x.key) };
    });
  }
  const crumbs = last => `<nav class="kl-crumbs" aria-label="${t('Breadcrumb')}"><a href="index.html">${t('Home')}</a>${CHEV}<a href="matches.html${g ? '?day=' + encodeURIComponent(g.date) : ''}">${t('Open games')}</a>${CHEV}<span>${last}</span></nav>`;

  // the players picked: ticked people on the account, then the guests added for this booking (adult games only)
  function chosen(){
    const list = people(), ok = list.filter(x => !x.why);
    picks = picks.filter(k => ok.some(x => x.key === k));
    const q = quote && quote.people || [];
    const freeOf = (type, key) => { const hit = q.find(x => x.type === type && (type === 'guest' ? 'tel:' + x.phone === key : type === 'child' ? 'child:' + x.ref === key : true)); return hit ? hit.free : null; };
    return [...ok.filter(x => picks.includes(x.key)).map(x => ({ ...x, free: freeOf(x.you ? 'me' : 'child', x.key) ?? x.free })),
      ...guests.map(x => ({ key: 'tel:' + x.phone, guest: true, name: x.name, phone: x.phone, free: freeOf('guest', 'tel:' + x.phone) ?? false }))];
  }
  // the server works out what each player pays (a guest's first game is free too, checked by their mobile)
  async function requote(){
    const players = [...picks.map(k => ({ ref: k === 'me' ? 'me' : k.slice(6) })), ...guests.map(x => ({ guest: { name: x.name, phone: x.phone } }))];
    const n = ++qSeq; if (!players.length || !me){ quote = null; return; }
    try { const r = await fetch('/api/games/quote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ order: { kind: 'game', game: g.id, players } }) });
      const d = await r.json().catch(() => ({})); if (n !== qSeq) return; quote = r.ok ? d : null; if (!r.ok && d.error) err = t(d.error); paint(); } catch (x) {}
  }
  function joinBox(sp, c, left){
    const list = people(), ok = list.filter(x => !x.why);
    if (!picks.length && !guests.length && ok.length === 1 && !joinBox.auto){ picks = [ok[0].key]; joinBox.auto = true; requote(); }
    const who = chosen(), n = who.length, room = left - n, base = who.filter(x => !x.free).length * g.price;
    // offers (f/offers-data.js): the best one for this many players comes off what's left after free first games
    const OF = window.SFA_OFFER_UI, item = { sport: g.sport, court: g.court }, B = OF && n ? OF.best('game', item, n, base) : null;
    const price = B ? Math.round((base - B.save) * 100) / 100 : base;
    const when = `${P.date(toDate(g.date), 'full')} · <bdi>${P.time(g.start)}</bdi> – <bdi>${P.time(g.start + SLOT)}</bdi>`;
    const closed = started() ? t('This game has already started.') : left <= 0 ? t('This game is full.') : '';
    if (!me) return `<div class="jn"><p class="note">${t('Sign in to join a game.')}</p><button type="button" class="book" data-signin>${t('Sign in')}</button></div>`;
    if (closed) return `<div class="jn"><p class="note bad">${closed}</p><a class="book ghost" href="matches.html">${t('Find another game')}</a></div>`;
    const adults = g.who !== 'kids', F = gForm || {};
    const row = x => `<button type="button" class="opt" role="checkbox" aria-checked="${picks.includes(x.key)}" data-pick="${esc(x.key)}"${x.why || (!picks.includes(x.key) && room <= 0) ? ' disabled' : ''}><span class="box" aria-hidden="true">${TICK}</span>
          <span><b>${esc(x.you ? t('Myself') : x.name)}</b><small>${x.why || (!picks.includes(x.key) && room <= 0 ? t('No spots left') : x.age != null ? t('Age {n}', { n: x.age }) : '')}</small></span>${!x.why && x.free ? `<em>${t('First game free')}</em>` : ''}</button>`;
    const gRow = (x, i) => `<div class="gst"><span class="box" aria-hidden="true">${TICK}</span><span><b>${esc(x.name)}</b><small><bdi>+966 ${esc(fmtPhone(x.phone.slice(4)))}</bdi> · ${t('Guest')}</small></span>${who.find(y => y.key === 'tel:' + x.phone)?.free ? `<em>${t('First game free')}</em>` : '<span></span>'}<button type="button" class="gst-x" data-rmg="${i}" aria-label="${t('Remove {name}', { name: esc(x.name) })}">${X}</button></div>`;
    const form = gForm ? `<div class="gf" id="gForm"><div class="full${F.bad && F.bad.name ? ' bad' : ''}"><label for="gfN">${t("Guest's full name")}</label><div class="in"><input id="gfN" type="text" autocomplete="off" value="${esc(F.name || '')}" placeholder="${t('e.g. Omar Al-Harbi')}"></div><p class="e">${t('Enter their full name.')}</p></div>
          <div class="full${F.bad && F.bad.phone ? ' bad' : ''}"><label for="gfP">${t("Guest's mobile")}</label><div class="in"><span class="pre">+966</span><input id="gfP" type="tel" inputmode="numeric" autocomplete="off" maxlength="11" value="${esc(F.phone || '')}" placeholder="5X XXX XXXX"></div><p class="e">${esc(F.bad && F.bad.phone || '')}</p></div>
          <div class="gf-acts full"><button type="button" class="ok" data-gadd>${t('Add guest')}</button><button type="button" data-gcancel>${t('Cancel')}</button></div></div>` : '';
    const lines = who.map(x => `<span><span>${esc(x.you ? me.name : x.name)}</span><span>${x.free ? `<s>${P.money(g.price)}</s>${t('Free')}` : P.money(g.price)}</span></span>`).join('');
    return `<div class="jn"><div class="pl" role="group" aria-labelledby="plL"><span id="plL">${t("Who's playing?")}</span>
        <p class="pl-hint">${adults ? t('Tick yourself and add guests: each one gets their own spot and ticket.') : t('Tick each of your children who is playing: each one gets their own spot and ticket.')} ${left === 1 ? t('1 spot left') : t('{n} spots left', { n: left })}.</p>
        ${list.length ? list.map(row).join('') : `<p class="note">${t('Kids’ games are for your children aged 6 to 17. Add them in My children.')} <a href="profile.html#people">${t('My children')}</a></p>`}
        ${guests.map(gRow).join('')}${form}
        ${adults && !gForm ? `<button type="button" class="add-g" data-gopen${room <= 0 ? ' disabled' : ''}>${PLUS}<span>${room <= 0 ? t('No spots left') : t('Add a guest')}</span></button>` : ''}</div>
      ${OF ? OF.block('game', item, n, g.price, '', base) : ''}
      <dl class="rows"><dt>${t('Game')}</dt><dd>${esc(t(sp.name))} · ${esc(t(g.format))}</dd><dt>${t('When')}</dt><dd>${when}</dd><dt>${t('Where')}</dt><dd>${esc(t(c[0]))} · ${t('SFA Domes Dammam')}</dd>
        <dt>${t(n > 1 ? 'Players' : 'Player')}</dt><dd>${n ? `<span class="lines">${lines}</span>` : '—'}</dd>
        ${B ? `<dt class="of-line">${OF.line({ id: B.o.id, save: B.save })[0]}</dt><dd class="of-line">${OF.line({ id: B.o.id, save: B.save })[1]}</dd>` : ''}
        <span class="sep" aria-hidden="true"></span><dt class="total">${t('Total')}</dt><dd class="total">${n && price ? P.money(price) : n ? t('Free') : '—'}</dd></dl>
      ${who.some(x => x.free) ? `<p class="note">${t('Each person’s first open game is free.')}</p>` : ''}
      <p class="err" role="alert">${esc(err)}</p>
      <button type="button" class="book" id="jGo"${!n || busy ? ' disabled' : ''}><span>${busy ? t('One moment…') : !n ? t("Choose who's playing") : t('Continue')}</span>${n && !busy ? ARROW : ''}</button></div>`;
  }

  function paint(){
    if (!g){
      root.innerHTML = `${crumbs(t('Game'))}<div class="gm-empty"><p>${t('That game is no longer on.')}</p><a class="book" href="matches.html" style="width:auto">${t('See open games')}</a></div>`;
      document.getElementById('go').classList.remove('on'); return;
    }
    const sp = S[g.sport], c = sp.courts[g.court], n = taken(), left = Math.max(0, g.spots - n), w = WHO[g.who], title = `${t(sp.name)} · ${t(g.format)}`;
    document.title = `${t(sp.name)} · ${t('Open game')} · SFA Domes`;
    root.innerHTML = `${crumbs(esc(title))}
      <div class="gm-photo"><img src="${window.SFA_COURT_IMG(g.sport, c)}" alt=""></div>
      <div class="kl-cols"><div class="kl-main">
        <header class="kl-head about" id="overview" style="padding:0;border:0;background:none">
          <p class="eyebrow lbl"><span class="ico" aria-hidden="true">${icon(sp)}</span>${t('Open game')} · ${t('SFA Domes Dammam')}</p>
          <h1>${esc(title)}</h1>
          <ul class="kl-badges"><li class="${g.who === 'kids' ? 'kids' : ''}">${CHK}<span>${t(w.label)}</span></li><li>${CHK}<span>${t('Indoor')}</span></li><li>${CHK}<span>${t('Bibs and balls provided')}</span></li><li class="free">${CHK}<span>${t('First game free')}</span></li></ul>
          <ul class="kl-facts">
            <li>${I.cal}<div><b>${P.date(toDate(g.date), 'full')}</b><small><bdi>${P.time(g.start)}</bdi> – <bdi>${P.time(g.start + SLOT)}</bdi> · ${t('{m} minutes', { m: SLOT })}</small></div></li>
            <li>${I.who}<div><b>${t(w.label)}</b><small>${t(g.who === 'kids' ? 'Book spots for your children' : 'Book spots for yourself and guests')}</small></div></li>
            <li>${I.fmt}<div><b>${esc(t(g.format))}</b><small>${t('Up to {n} players', { n: g.spots })}</small></div></li>
            <li>${I.pin}<div><b>${t('SFA Domes Dammam')}</b><small>${esc(t(c[0]))}</small></div></li></ul>
          <div class="spots"><div class="spots-t"><span>${left <= 0 ? t('Full') : left === 1 ? t('1 spot left') : t('{n} spots left', { n: left })}</span><small>${t('{a} of {b} players', { a: n, b: g.spots })}</small></div>
            <div class="bar" style="--n:${g.spots}" aria-hidden="true">${Array.from({ length: g.spots }, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div></div>
        </header>
        <section class="kl-sec" id="join" aria-labelledby="joinH"><h2 class="kl-h" id="joinH">${t('Join this game')}</h2>${joinBox(sp, c, left)}</section>
        <section class="kl-sec" id="how" aria-labelledby="howH"><h2 class="kl-h" id="howH">${t('How it works')}</h2>
          <ol class="how"><li><span><b>${t('Join and pay for your spot only')}</b>${t('No team needed. Each person’s first open game is free.')}</span></li>
            <li><span><b>${t('Arrive 10 minutes early')}</b>${t('Check in at reception with your ticket’s QR code.')}</span></li>
            <li><span><b>${t('Play')}</b>${t('A coach splits the teams and runs the game. Bibs and balls are provided.')}</span></li></ol></section>
        ${document.getElementById('locTpl').innerHTML}
      </div>
      <aside class="kl-side" aria-label="${t('Price')}"><div class="kl-card"><div class="hero-book"><p class="hero-price"><b>${P.money(g.price)} <small>${t('/ player')}</small></b></p>${window.SFA_OFFER_UI ? window.SFA_OFFER_UI.tag('game', { sport: g.sport, court: g.court }) : ''}
          <div class="hero-actions"><a class="cta" href="#join"><span>${t('Join game')}</span>${ARROW}</a></div></div><p class="side-sub">${t('per player')} · ${t('First game free')}</p></div>
        <p class="kl-note">${CHK}<span>${t('Each person’s first open game is free.')}</span></p></aside></div>`;
    document.getElementById('goWhen').innerHTML = `${P.date(toDate(g.date), 'short')} · <bdi>${P.time(g.start)}</bdi>`;
    document.getElementById('goTotal').innerHTML = `${P.money(g.price)} <small>${t('/ player')}</small>`;
    document.getElementById('goBtn').innerHTML = `<span>${t('Join game')}</span>${ARROW}`;
    P.translate?.(root);
    watch();
  }
  // the bottom bar (phones) and the price card step aside while the booking section is in view, as on court and program pages
  let io;
  function watch(){
    io && io.disconnect(); const j = document.getElementById('join'), go = document.getElementById('go'); if (!j) return;
    const phone = matchMedia('(max-width:1023px)');   // the bar is for phones and tablets only; desktop has the price card
    io = new IntersectionObserver(([e]) => { go.classList.toggle('on', phone.matches && !e.isIntersecting); document.body.classList.toggle('kl-in-book', e.isIntersecting); }, { rootMargin: '0px 0px -30% 0px' });
    io.observe(j);
  }

  document.addEventListener('click', e => { const a = e.target.closest('a[href="#join"]'); if (!a) return; e.preventDefault(); document.getElementById('join')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  const refocus = sel => root.querySelector(sel)?.focus();
  root.addEventListener('click', async e => {
    const o = e.target.closest('[data-pick]');
    if (o && !o.disabled){ const k = o.dataset.pick; picks = picks.includes(k) ? picks.filter(x => x !== k) : [...picks, k]; err = ''; paint(); refocus(`[data-pick="${CSS.escape(k)}"]`); requote(); return; }
    if (e.target.closest('[data-gopen]')){ gForm = { name: '', phone: '' }; paint(); refocus('#gfN'); return; }
    if (e.target.closest('[data-gcancel]')){ gForm = null; paint(); refocus('[data-gopen]'); return; }
    if (e.target.closest('[data-gadd]')){
      const name = root.querySelector('#gfN').value.trim().replace(/\s+/g, ' '), digits = root.querySelector('#gfP').value.replace(/\D/g, '').replace(/^0/, ''), phone = '+966' + digits, bad = {};
      if (name.split(' ').length < 2) bad.name = true;
      if (!/^5\d{8}$/.test(digits)) bad.phone = t('Enter a Saudi mobile number starting with 5.');
      else if (me && phone === me.phone) bad.phone = t('That mobile number is yours: tick Myself instead.');
      else if (guests.some(x => x.phone === phone)) bad.phone = t('This guest is already on the list.');
      if (bad.name || bad.phone){ gForm = { name, phone: fmtPhone(digits), bad }; paint(); refocus(bad.name ? '#gfN' : '#gfP'); return; }
      guests.push({ name, phone }); gForm = null; err = ''; paint(); refocus('[data-gopen]'); requote(); return;
    }
    const rg = e.target.closest('[data-rmg]'); if (rg){ guests.splice(+rg.dataset.rmg, 1); err = ''; paint(); refocus('[data-gopen]'); requote(); return; }
    if (e.target.closest('[data-signin]')) return window.SFA_AUTH.open({ view: 'login', reason: t('Sign in to join a game.') });
    if (!e.target.closest('#jGo')) return;
    const players = [...picks.map(k => ({ ref: k === 'me' ? 'me' : k.slice(6) })), ...guests.map(x => ({ guest: { name: x.name, phone: x.phone } }))];
    if (!players.length) return;
    // terms, the summary, offers and Pay are on the checkout page, the same as courts and programs (Ahmed, 2026-11-17)
    try { sessionStorage.setItem('sfaOrder', JSON.stringify({ kind: 'game', game: g.id, players })); } catch (x) {}
    location.href = 'checkout.html';
  });
  // the guest's mobile is typed as 5X XXX XXXX
  root.addEventListener('input', e => { if (e.target.id === 'gfP'){ const v = e.target.value.replace(/\D/g, '').replace(/^0/, '').slice(0, 9); e.target.value = fmtPhone(v); }
    if (gForm && (e.target.id === 'gfP' || e.target.id === 'gfN')){ gForm[e.target.id === 'gfN' ? 'name' : 'phone'] = e.target.value; e.target.closest('.bad')?.classList.remove('bad'); } });
  root.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'gfN' || e.target.id === 'gfP')){ e.preventDefault(); root.querySelector('[data-gadd]')?.click(); } });

  async function load(){
    me = await window.SFA_AUTH.me();
    const [b, o] = await Promise.all([me ? fetch('/api/auth/bookings').then(r => r.json()).catch(() => ({})) : {}, g ? fetch('/api/games?days=' + g.date, { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})) : {}]);
    mine = b.bookings || []; online = o || {}; paint();
  }
  paint(); load();
  addEventListener('sfa:auth', load);
  addEventListener('sfa:prefs', paint);
})();
</script>
</body>
</html>
